<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Insert Koin — Wiki</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://mauktenieb.github.io/insertkoin/">
<style>
/* Le wiki du motel (Mauk Tenieb, 11 nov. 2026, 14 h 14) : nom tiré au hasard à chaque visite, entrées tirées des fiches de la Fauna et des programmes (kdata.js), mots de Mauk Tenieb seuls ; page d'encyclopédie en ligne des années 2000, sur papier crème */
@font-face{font-family:Arimo;src:url(a/f/arimo-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:Arimo;font-weight:700;src:url(a/f/arimo-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:Garamond;src:url(a/f/font-eb-garamond-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:Garamond;font-style:italic;src:url(a/f/font-eb-garamond-latin-400-italic.woff2) format('woff2')}
:root{--ink:#1d1a16;--paper:#f6f1e4;--rule:#a7a08e;--link:#1f4f9e;--seen:#5a3f8c;--red:#9b2a1f;--side:#ece4d0}
*{box-sizing:border-box}
html,body{margin:0;background:#1a1612;color:var(--ink)}
body{font:15px/1.6 Arimo,Arial,Helvetica,sans-serif;padding-bottom:calc(64px + env(safe-area-inset-bottom));-webkit-text-size-adjust:100%}
a{color:var(--link);text-decoration:none}a:visited{color:var(--seen)}a:hover{text-decoration:underline}
a.new{color:var(--red)}
#w{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:176px 1fr;gap:0;min-height:100vh}
#side{background:var(--side);padding:16px 12px;border-right:1px solid var(--rule)}
#logo{display:block;text-align:center;margin:0 0 18px;color:var(--ink);text-decoration:none}
#logo b{display:block;font:italic 28px/1 Garamond,Georgia,serif;letter-spacing:.01em}
#logo svg{width:92px;height:92px;display:block;margin:0 auto 6px}
#side h3{font:700 11px/1 Arimo,Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#5d5544;margin:16px 0 6px;border-bottom:1px solid var(--rule);padding-bottom:4px}
#side ul{list-style:none;margin:0;padding:0}#side li{margin:2px 0;font-size:13px}
#q{width:100%;font:13px Arimo,Arial,sans-serif;padding:5px 6px;border:1px solid var(--rule);background:#fffdf6;color:var(--ink);border-radius:0}
#main{background:var(--paper);padding:22px 32px 40px;border-left:1px solid #fff8}
#tabs{display:flex;gap:2px;margin:-6px 0 14px;font-size:12px}
#tabs span{border:1px solid var(--rule);border-bottom:0;padding:3px 10px;background:#fbf8ef}#tabs span.on{background:var(--paper);font-weight:700}
h1{font:400 30px/1.2 Garamond,Georgia,serif;margin:0 0 4px;border-bottom:1px solid var(--rule);padding-bottom:4px}
.from{font-size:12px;color:#6d6553;margin:0 0 16px}
h2{font:400 21px/1.3 Garamond,Georgia,serif;border-bottom:1px solid var(--rule);margin:22px 0 8px;padding-bottom:2px}
.box{float:right;width:250px;margin:0 0 14px 20px;border:1px solid var(--rule);background:#fbf8ef;font-size:13px}
.box img{display:block;width:100%;height:auto;background:#000}
.box .cap{padding:6px 8px;font-style:italic;font-family:Garamond,Georgia,serif;font-size:15px;text-align:center;border-bottom:1px solid var(--rule)}
.box table{width:100%;border-collapse:collapse}.box th,.box td{padding:3px 8px;border-top:1px solid #d9d1bd;text-align:left;vertical-align:top}.box th{width:44%;color:#5d5544;font-weight:700}
.motto{font:italic 20px/1.4 Garamond,Georgia,serif;margin:6px 0 14px}
.toc{display:inline-block;border:1px solid var(--rule);background:#fbf8ef;padding:8px 14px;font-size:13px;margin:4px 0 8px}.toc ol{margin:4px 0 0;padding-left:20px}
.cols{columns:3 180px;column-gap:24px;font-size:14px}.cols div{break-inside:avoid;margin:0 0 2px}
.dl{margin:0 0 .7em}
.cat{clear:both;margin-top:30px;border:1px solid var(--rule);background:#fbf8ef;padding:5px 10px;font-size:12px}
.foot{font-size:11px;color:#6d6553;margin-top:16px}
@media (max-width:760px){#w{grid-template-columns:1fr;grid-template-rows:auto 1fr}#side{border-right:0;border-bottom:1px solid var(--rule);padding:10px 12px 10px 52px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center}
 #logo{margin:0;display:flex;align-items:center;gap:8px}#logo svg{width:40px;height:40px;margin:0}#logo b{font-size:22px}
 #side .nav{display:none}#main{padding:16px 16px 30px}.box{float:none;width:100%;margin:0 0 14px}h1{font-size:26px}}
</style>
</head>
<body>
<div id="w">
 <aside id="side">
  <a id="logo" href="#/"><svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="44" fill="none" stroke="#1d1a16" stroke-width="2"/><path d="M50 10 L86 74 L14 74 Z" fill="none" stroke="#1d1a16" stroke-width="1.6"/><path d="M50 90 L14 26 L86 26 Z" fill="none" stroke="#9b2a1f" stroke-width="1.6"/><circle cx="50" cy="50" r="6" fill="#1d1a16"/></svg><b id="nm">Wiki</b></a>
  <div><input id="q" type="search" autocomplete="off" aria-label="Search"></div>
  <div class="nav"><h3 id="h-nav"></h3><ul id="nav"></ul><h3 id="h-f"></h3><ul id="lf"></ul><h3 id="h-p"></h3><ul id="lp"></ul></div>
 </aside>
 <main id="main" aria-live="polite"></main>
</div>
<script src="kdata.js"></script>
<script src="wiki-texts.js"></script>
<script>
(function(){
var D=window.KDATA||{F:[],P:[],SAY:{}},lang='en';try{lang=localStorage.getItem('ik.lang')==='fr'?'fr':'en'}catch(e){}var FR=lang==='fr';document.documentElement.lang=lang;
/* le nom du wiki change à chaque visite */
var NAMES=['KalabWiki','Weaky','WigWiki','Kerema'],NQ=(location.search.match(/[?&]n=([A-Za-z]+)/)||[])[1],NM=NAMES.indexOf(NQ)>=0?NQ:NAMES[Math.floor(Math.random()*NAMES.length)];
document.getElementById('nm').textContent=NM;document.title=NM;
var T=FR?{nav:'Navigation',f:'La Fauna',p:'Programmes',home:'Accueil',rnd:'Au hasard',all:'Toutes les entrées',art:'Article',q:'Rechercher',none:'Zéro entrée',from:'Une entrée de '+NM,cat:'Catégorie',toc:'Sommaire'}:{nav:'Navigation',f:'The Fauna',p:'Programs',home:'Main page',rnd:'Random entry',all:'All entries',art:'Article',q:'Search',none:'Zero entries',from:'An entry of '+NM,cat:'Category',toc:'Contents'};
var $=function(s){return document.querySelector(s)};$('#q').placeholder=T.q;$('#q').setAttribute('aria-label',T.q);
$('#h-nav').textContent=T.nav;$('#h-f').textContent=T.f;$('#h-p').textContent=T.p;
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
var E=[];D.F.forEach(function(f){E.push({k:'m',id:f.slug,name:f.name,o:f})});D.P.forEach(function(p){E.push({k:'p',id:p.id,name:p.name,o:p})});
/* 11 nov. 2026 (Mauk Tenieb, 14 h 29) : en dernière entrée, l'interview « Korhogo, Delboy, l'Idéel », dans la langue du visiteur */
var TX=window.WIKITXT||{},TE=Object.keys(TX).map(function(k){var v=TX[k][FR?'fr':'en'];return {k:'t',id:k,name:v.t,o:v}});E=E.concat(TE);
function href(e){return '#/'+e.k+'/'+e.id}
/* chaque nom d'entrée cité dans un texte devient un lien */
var NAMEX=E.slice().sort(function(a,b){return b.name.length-a.name.length}),RX=new RegExp('('+NAMEX.map(function(e){return e.name.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}).join('|')+')','g');
function linky(s,self){return esc(s).replace(RX,function(m){var e=NAMEX.filter(function(x){return esc(x.name)===m})[0];return e&&e.id!==self?'<a href="'+href(e)+'">'+m+'</a>':m})}
function say(id){var s=(D.SAY||{})[id];return s?(FR?s[1]:s[0]):''}
function nav(){$('#nav').innerHTML='<li><a href="#/">'+T.home+'</a></li><li><a href="#/hasard">'+T.rnd+'</a></li><li><a href="#/tout">'+T.all+'</a></li>';
 $('#lf').innerHTML=D.F.map(function(f){return '<li><a href="#/m/'+f.slug+'">'+esc(f.name)+'</a></li>'}).join('');
 $('#lp').innerHTML=D.P.map(function(p){return '<li><a href="#/p/'+p.id+'">'+esc(p.name)+'</a></li>'}).join('')+TE.map(function(e){return '<li style="margin-top:10px"><a href="'+href(e)+'">'+esc(e.name)+'</a></li>'}).join('')}
function tabs(){return '<div id="tabs"><span class="on">'+T.art+'</span></div>'}
function list(es){return '<div class="cols">'+es.slice().sort(function(a,b){return a.name.localeCompare(b.name)}).map(function(e){return '<div><a href="'+href(e)+'">'+esc(e.name)+'</a></div>'}).join('')+'</div>'}
function home(){var G=D.F.filter(function(f){return f.motto&&/[A-Za-zÀ-ÿ]{3}/.test(f.motto)}),f=G[Math.floor(Math.random()*G.length)]||{};
 return tabs()+'<h1>'+esc(NM)+'</h1><p class="motto">“'+esc(f.motto||'')+'”</p><p class="from"><a href="#/m/'+f.slug+'">'+esc(f.name||'')+'</a></p><h2>'+T.f+'</h2>'+list(E.filter(function(e){return e.k==='m'}))+'<h2>'+T.p+'</h2>'+list(E.filter(function(e){return e.k==='p'}))+(TE.length?'<h2>&nbsp;</h2>'+TE.map(function(e){return '<p><a href="'+href(e)+'">'+esc(e.name)+'</a></p>'}).join(''):'')}
var LAB={sub:'',formula:'Formula',appearance:'Appearance',faction:'Faction',masks:'Masks',profile:'Profile',powers:'Powers',maskomatics:'Maskomatics',hexagram:'Hexagram','mini-stories':'Mini-stories',krewsmatics:'Krewsmatics',korong:'Korong!'};
function mask(f){var st=f.stats||{},sec=['appearance','profile','faction','masks','powers','maskomatics','hexagram','mini-stories','krewsmatics','korong'].filter(function(k){return k==='korong'?(f.korong_en||f.korong_fr):f[k]});
 var h=tabs()+'<h1>'+esc(f.name)+'</h1><p class="from">'+T.from+'</p>';
 h+='<div class="box"><img src="../fauna-'+f.slug+'.webp" alt="'+esc(f.name)+'" loading="lazy" onerror="this.remove()"><div class="cap">'+esc(f.sub||'')+'</div><table><tr><th>N.</th><td>'+esc(f.num)+'</td></tr>'+Object.keys(st).map(function(k){return '<tr><th>'+k+'</th><td>'+esc(st[k])+'</td></tr>'}).join('')+(f.formula?'<tr><th>'+LAB.formula+'</th><td>'+esc(f.formula)+'</td></tr>':'')+'</table></div>';
 h+='<p class="motto">“'+linky(f.motto,f.slug)+'”</p>';
 if(sec.length>3)h+='<div class="toc"><b>'+T.toc+'</b><ol>'+sec.map(function(k){return '<li><a href="#/m/'+f.slug+'/'+k+'">'+LAB[k]+'</a></li>'}).join('')+'</ol></div>';
 sec.forEach(function(k){var v=k==='korong'?(FR?(f.korong_fr||f.korong_en):(f.korong_en||f.korong_fr)):f[k];h+='<h2 id="s-'+k+'">'+LAB[k]+'</h2><p>'+linky(v,f.slug)+'</p>'});
 return h+'<div class="cat">'+T.cat+' : <a href="#/tout">'+T.f+'</a></div>'}
function prog(p){var s=say(p.id),h=tabs()+'<h1>'+esc(p.name)+'</h1><p class="from">'+T.from+'</p>';
 h+='<div class="box"><a href="'+esc(p.url)+'"><img src="'+esc(p.thumb)+'" alt="'+esc(p.name)+'" loading="lazy" onerror="this.remove()"></a><table><tr><th>'+(FR?'Fichier':'File')+'</th><td>'+esc(p.exe)+'</td></tr><tr><th>'+(FR?'Famille':'Family')+'</th><td>'+esc(p.group)+'</td></tr></table></div>';
 if(s)h+='<p class="motto">“'+linky(s,p.id)+'”</p>';
 return h+'<div class="cat">'+T.cat+' : <a href="#/tout">'+T.p+'</a></div>'}
function find(k,id){return E.filter(function(e){return e.k===k&&e.id===id})[0]}
function route(){var r=location.hash.replace(/^#\/?/,'').split('/'),m=$('#main'),h;
 if(r[0]==='hasard'){var e=E[Math.floor(Math.random()*E.length)];location.replace(href(e));return}
 if(r[0]==='tout')h=tabs()+'<h1>'+T.all+'</h1>'+list(E);
 else if(r[0]==='m'&&find('m',r[1]))h=mask(find('m',r[1]).o);
 else if(r[0]==='p'&&find('p',r[1]))h=prog(find('p',r[1]).o);
 else if(r[0]==='t'&&find('t',r[1])){var o=find('t',r[1]).o;h=tabs()+'<h1>'+esc(o.t)+'</h1><p class="from">'+T.from+'</p>'+o.p.map(function(x){return '<p'+(/^—/.test(x)?' class="dl"':'')+'>'+x+'</p>'}).join('')}
 else if(r[0]==='q'){var q=decodeURIComponent(r[1]||'').toLowerCase(),hit=E.filter(function(e){return (e.name+' '+JSON.stringify(e.o)).toLowerCase().indexOf(q)>=0});h=tabs()+'<h1>'+esc(q)+'</h1>'+(hit.length?list(hit):'<p>'+T.none+'</p>')}
 else h=home();
 m.innerHTML=h;var s=r[2]&&document.getElementById('s-'+r[2]);if(s)s.scrollIntoView();else scrollTo(0,0)}
$('#q').addEventListener('keydown',function(e){if(e.key==='Enter'&&this.value.trim()){location.hash='#/q/'+encodeURIComponent(this.value.trim());this.blur()}});
nav();addEventListener('hashchange',route);route();
/* Baku Boom remet le wiki à sa page d'accueil, sous un nouveau nom */
window.__ikBoom=function(){location.replace(location.pathname)};
})();
</script>
<script src="motel.js"></script>
<script src="panneau.js"></script>
</body>
</html>
