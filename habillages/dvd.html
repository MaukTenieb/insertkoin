<style>
@font-face{font-family:Garamond;src:url(a/f/font-eb-garamond-latin-400-normal.woff2) format('woff2')}

*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;overflow:hidden;user-select:none;-webkit-tap-highlight-color:transparent}
#room{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
#wrap{position:relative;width:var(--sw);height:var(--sh);background:#000}
/* image PAL 16:9 : 1024 × 576, légèrement adoucie comme un MPEG-2 */
#stage{position:absolute;left:0;top:0;width:1024px;height:576px;transform-origin:0 0;overflow:hidden;background:#000;color:#ece6d6;font-family:Garamond,serif}
#stage .soft{position:absolute;inset:0;filter:blur(.35px)}
.scr{position:absolute;inset:0;display:none}
.scr.on{display:block}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .35s;z-index:40}
#fade.on{opacity:1}
/* langue */
#lang{background:#000}
#lang .q{position:absolute;left:0;right:0;top:220px;text-align:center;font:italic 22px Garamond;color:#9a9282;letter-spacing:.04em}
#lang .mn{position:absolute;left:0;right:0;top:270px;display:flex;justify-content:center;gap:90px}
/* avertissement */
#warn{background:#000}
#warn .t{position:absolute;left:130px;right:130px;top:70px;text-align:center;font:18px/1.55 Garamond;color:#d8d2c2}
#warn .t h2{font:400 20px Garamond;letter-spacing:.32em;margin:0 0 18px;color:#fff}
#warn .t p{margin:0 0 16px}
#warn .t .en{color:#9a9282;font-style:italic}
/* logo d'éditeur */
#ident{background:#000}
#ident img{position:absolute;left:50%;top:50%;height:420px;transform:translate(-50%,-50%);opacity:0;transition:opacity 1.2s}
#ident.show img{opacity:1}
/* fond animé du menu */
.bg{position:absolute;inset:0;background:center/cover;opacity:0;transition:opacity 2.5s;filter:saturate(.85) brightness(.7) contrast(1.05)}
.bg.on{opacity:1;animation:pan 18s linear forwards}
@keyframes pan{from{transform:scale(1.04) translateX(1.5%)}to{transform:scale(1.1) translateX(-1.5%)}}
#shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.82) 0,rgba(0,0,0,.55) 38%,rgba(0,0,0,0) 70%)}
#title{position:absolute;left:84px;top:70px;font:52px/1 Garamond,serif;color:#f4f1ea;letter-spacing:.16em;text-transform:uppercase}
#title small{display:block;font:italic 19px Garamond;letter-spacing:.06em;color:#b8b0a0;margin-top:10px}
/* entrées de menu : le surlignage d'un DVD recolore la sous-image, aplat sans lissage */
.mn{position:absolute}
.it{display:block;font:24px/1.75 Garamond;letter-spacing:.18em;text-transform:uppercase;color:#d8d2c2;cursor:pointer;white-space:nowrap;padding-left:26px;position:relative}
.it::before{content:"";position:absolute;left:0;top:50%;width:9px;height:9px;margin-top:-5px;background:#e8c020;opacity:0}
.it.hl{color:#e8c020}
.it.hl::before{opacity:1}
.it.sel{color:#fff;outline:2px solid #e8c020;outline-offset:2px}
#main .mn{left:84px;top:250px}
/* pages intérieures */
.hd{position:absolute;left:84px;top:52px;font:28px Garamond;letter-spacing:.24em;text-transform:uppercase;color:#ece6d6}
.hd i{font-style:normal;color:#8a8272;font-size:16px;letter-spacing:.12em;margin-left:16px}
.ft{position:absolute;left:84px;right:84px;bottom:42px;display:flex;justify-content:space-between;align-items:center}
.ft .it{font-size:18px;line-height:1.4}
.inner{background:#0c0b0a}

/* chapitres */
.chg{position:absolute;left:120px;right:120px;top:108px;display:grid;grid-template-columns:repeat(3,1fr);gap:18px 26px}
.ch{cursor:pointer}
.ch .im{aspect-ratio:16/9;background:#000 center/cover;outline:2px solid #3a362e;outline-offset:3px}
.ch .lb{margin-top:9px;font:17px/1.25 Garamond;color:#d8d2c2}
.ch .lb b{display:block;font-weight:400;font-size:13px;letter-spacing:.2em;color:#8a8272}
.ch.hl .im{outline-color:#e8c020}
.ch.hl .lb{color:#e8c020}
/* fiches */
.cast{position:absolute;left:84px;right:84px;top:118px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:2px 30px}
.cast .it{font-size:18px;line-height:1.95;letter-spacing:.1em;text-transform:none}
.bio{position:absolute;left:84px;right:84px;top:110px;bottom:100px;display:grid;grid-template-columns:240px 1fr;gap:36px}
.bio .ph{background:#0c0b0a;display:flex;align-items:flex-end;justify-content:center;overflow:hidden;border-bottom:1px solid #3a362e}
.bio .ph img{max-width:100%;max-height:100%}
.bio .tx{font:17px/1.45 Garamond;color:#d8d2c2;overflow:hidden}
.bio .tx h3{margin:0 0 4px;font:400 30px Garamond;letter-spacing:.06em;color:#ece6d6}
.bio .tx .m{font-style:italic;color:#b8b0a0;margin-bottom:14px}
.bio .tx dl{display:grid;grid-template-columns:120px 1fr;gap:6px 14px;margin:0}
.bio .tx dt{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:#8a8272;padding-top:3px}
.bio .tx dd{margin:0}
/* galerie */
.gal{position:absolute;left:0;right:0;top:0;bottom:0;background:#000 center/contain no-repeat}
.gal .n{position:absolute;right:84px;top:44px;font:15px Garamond;letter-spacing:.2em;color:#8a8272}
/* textes de bonus */
.txt{position:absolute;left:84px;right:84px;top:118px;font:18px/1.55 Garamond;color:#d8d2c2}
.txt .row{display:grid;grid-template-columns:240px 1fr;gap:20px;margin-bottom:14px}
.txt .row span{color:#8a8272;font-style:italic}
/* réglages */
.set{position:absolute;left:84px;top:140px;display:grid;grid-template-columns:220px auto;gap:20px 30px;align-items:center}
.set .k{font:15px Garamond;letter-spacing:.24em;text-transform:uppercase;color:#8a8272}
.set .v{display:flex;gap:30px}
.set .v .it{font-size:20px;letter-spacing:.12em}
/* sous-titres du lecteur */
#subs{position:absolute;left:0;right:0;bottom:30px;text-align:center;font:600 24px/1.25 Arial,sans-serif;color:#fff;text-shadow:2px 2px 0 #000,-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000;padding:0 140px;pointer-events:none;z-index:30}
/* affichage du lecteur (OSD) */
#osd{position:absolute;left:56px;top:40px;font:30px/1.1 VT323,monospace;color:#fff;text-shadow:2px 2px 0 #000;display:none;z-index:35}
#osd.on{display:block}
#no{position:absolute;right:60px;top:44px;width:64px;height:64px;border:7px solid #fff;border-radius:50%;display:none;z-index:35}
#no::after{content:"";position:absolute;left:50%;top:-4px;bottom:-4px;width:7px;margin-left:-3.5px;background:#fff;transform:rotate(45deg)}
#no.on{display:block;animation:nob 1.1s forwards}
@keyframes nob{75%{opacity:1}to{opacity:0}}
#saver{position:absolute;inset:0;background:#000;display:none;z-index:50}
#saver.on{display:block}
#bounce{position:absolute;font:italic 700 34px/1 Arimo,sans-serif;letter-spacing:.06em;white-space:nowrap}
/* télécommande */
#rwrap{display:flex;align-items:center;gap:18px}
#remote{display:grid;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(3,48px);gap:6px;padding:12px;background:#1b1a19;border-radius:22px;box-shadow:inset 0 1px 0 #333,0 6px 18px #000}
#remote button{border:0;border-radius:50%;background:#2e2c2a;color:#d8d2c2;font:13px Arial,sans-serif;box-shadow:0 2px 0 #0a0a0a;cursor:pointer;touch-action:manipulation}
#remote button:active{transform:translateY(1px);box-shadow:none}
#remote .ok{background:#4a4640;font-weight:bold}
#remote .s{font-size:9px;border-radius:10px;letter-spacing:.06em}
#rside{display:flex;flex-direction:column;gap:7px}
#rside button{border:0;border-radius:10px;padding:9px 12px;background:#2e2c2a;color:#d8d2c2;font:10px Arial,sans-serif;letter-spacing:.08em;box-shadow:0 2px 0 #0a0a0a;cursor:pointer}
#ir{width:8px;height:8px;border-radius:50%;background:#300;margin:0 auto}
#ir.on{background:#f33;box-shadow:0 0 8px #f33}

</style>
</head>
