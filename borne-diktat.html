<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>DiktatFaune — Borne Insert Koin</title>
<link rel="stylesheet" href="fonts.css">
<style>
:root{--ink:#f3e8d2;--dim:rgba(243,232,210,.55);--acc:#ffa726;--rec:#ff3b2f;--line:rgba(255,167,38,.45);--bg:#0b0907}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'DM Mono',ui-monospace,monospace}
body{display:grid;place-items:center;padding:14px;background:radial-gradient(ellipse at 50% 30%,#1b140d,#070504 70%)}
main{width:min(100%,640px);display:grid;gap:14px;justify-items:center;text-align:center}
h1{margin:0;font:400 clamp(38px,8vw,64px)/1 'Bebas Neue',Impact,sans-serif;letter-spacing:.08em;color:#ffe3a0;text-shadow:0 0 14px rgba(255,167,38,.55),0 2px 0 #000}
.row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
button,select{min-height:44px;min-width:64px;padding:0 16px;border:1px solid var(--line);border-radius:4px;background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(0,0,0,.25));
  color:var(--ink);font:13px/1.2 'DM Mono',monospace;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 2px 0 #000}
button:hover{background:rgba(255,167,38,.14)}
button.on{background:var(--acc);color:#1a0f05;border-color:var(--acc);box-shadow:0 0 16px rgba(255,167,38,.55)}
button:disabled{opacity:.35;cursor:default}
select{max-width:100%;text-transform:none;letter-spacing:.04em}
#rec{width:120px;height:120px;border-radius:50%;padding:0;border:4px solid #2a0a06;background:radial-gradient(circle at 40% 35%,#ff8a7a,var(--rec) 45%,#7a0f08 100%);
  color:#fff;font:400 22px/1 'Bebas Neue',Impact,sans-serif;letter-spacing:.12em;box-shadow:0 6px 0 #2a0a06,0 10px 22px rgba(0,0,0,.6),0 0 24px rgba(255,59,47,.35)}
#rec:active{transform:translateY(4px);box-shadow:0 2px 0 #2a0a06}
#rec.live{animation:pulse .8s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 6px 0 #2a0a06,0 0 46px rgba(255,59,47,.9)}}
canvas{width:100%;height:90px;border-radius:4px;background:#000;box-shadow:inset 0 0 0 1px var(--line)}
.knob{display:grid;gap:4px;justify-items:center;font-size:11px;letter-spacing:.16em;color:var(--dim)}
input[type=range]{width:200px;accent-color:var(--acc)}
#msg{min-height:1.2em;font-size:12px;letter-spacing:.14em;color:var(--dim)}
</style>
</head>
<body>
<main>
  <h1>DIKTATFAUNE</h1>
  <div class="row" id="mic"><select id="dev" aria-label="Micro"></select></div>
  <div class="row" id="durs"><button data-s="3">3 s</button><button data-s="5" class="on">5 s</button><button data-s="10">10 s</button></div>
  <button id="rec" type="button">REC</button>
  <canvas id="wave" width="1200" height="180"></canvas>
  <div class="row">
    <label class="knob"><span id="pl">PITCH 0</span><input id="pitch" type="range" min="-12" max="12" step="1" value="0" aria-label="Pitch"></label>
    <label class="knob"><span id="sl">SPEED ×1</span><input id="speed" type="range" min="-4" max="4" step="1" value="0" aria-label="Speed"></label>
  </div>
  <div class="row"><button id="dir" type="button">▶ FORWARD</button><button id="play" type="button" disabled>PLAY</button><button id="save" type="button" disabled>SAVE</button></div>
  <div id="msg"></div>
</main>
<script src="ik-name.js"></script>
<script src="borne-musik.js"></script>
<script>
/* DiktatFaune : on enregistre 3, 5 ou 10 secondes au micro, on joue sur la hauteur, la vitesse et le sens, on sauvegarde en .wav au nom du calendrier républicain.
   Le micro se demande une fois par session : le flux reste ouvert dans la page de la borne. */
(function(){
  var $=function(i){return document.getElementById(i);},T=window.top||window,AC=null,stream=null,raw=null,out=null,clip=null,dur=5,rev=false,src=null;
  var FR=(document.documentElement.lang=(function(){try{return (T.__ik&&T.__ik.lang&&T.__ik.lang())||'en';}catch(e){return 'en';}})())==='fr';
  var L=FR?{rec:'REC',stop:'…',mic:'Le micro, une fois pour cette session ?',nomic:'MICRO ?',fw:'▶ ENDROIT',bw:'◀ ENVERS',play:'ÉCOUTER',save:'SAUVER',p:'HAUTEUR',s:'VITESSE'}:{rec:'REC',stop:'…',mic:'The mic, once for this session?',nomic:'MIC ?',fw:'▶ FORWARD',bw:'◀ BACKWARD',play:'PLAY',save:'SAVE',p:'PITCH',s:'SPEED'};
  $('play').textContent=L.play;$('save').textContent=L.save;$('dir').textContent=L.fw;
  function ac(){if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC;}
  function msg(t){$('msg').textContent=t||'';}
  function getMic(id){
    try{if(!id&&T.__diktatStream&&T.__diktatStream.active){stream=T.__diktatStream;return Promise.resolve(stream);}}catch(e){}
    msg(L.mic);
    return navigator.mediaDevices.getUserMedia({audio:id?{deviceId:{exact:id},echoCancellation:false,noiseSuppression:false,autoGainControl:false}:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}}).then(function(s){
      stream=s;try{T.__diktatStream=s;}catch(e){}msg('');listDevs();return s;});}
  function listDevs(){if(!navigator.mediaDevices.enumerateDevices)return;navigator.mediaDevices.enumerateDevices().then(function(d){var a=d.filter(function(x){return x.kind==='audioinput';}),sel=$('dev');
    sel.innerHTML='';a.forEach(function(x,i){var o=document.createElement('option');o.value=x.deviceId;o.textContent=x.label||('Mic '+(i+1));sel.appendChild(o);});
    var cur=stream&&stream.getAudioTracks()[0]&&stream.getAudioTracks()[0].getSettings().deviceId;if(cur)sel.value=cur;$('mic').hidden=a.length<2;});}
  $('dev').onchange=function(){if(stream)stream.getTracks().forEach(function(t){t.stop();});try{T.__diktatStream=null;}catch(e){}getMic(this.value);};
  [].forEach.call(document.querySelectorAll('#durs button'),function(b){b.onclick=function(){dur=+b.dataset.s;[].forEach.call(document.querySelectorAll('#durs button'),function(x){x.classList.toggle('on',x===b);});};});
  /* l'invite du micro arrive en début de jeu */
  if(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)getMic().catch(function(){msg(L.nomic);});else msg(L.nomic);

  $('rec').onclick=function(){var b=this;if(b.classList.contains('live'))return;
    (stream&&stream.active?Promise.resolve(stream):getMic()).then(function(s){var c=ac(),n=c.createMediaStreamSource(s),p=c.createScriptProcessor(4096,1,1),chunks=[],len=0,need=Math.round(c.sampleRate*dur),t0=performance.now();
      b.classList.add('live');var tick=setInterval(function(){b.textContent=Math.max(0,dur-(performance.now()-t0)/1000).toFixed(1);},100);
      p.onaudioprocess=function(e){if(len>=need)return;var d=e.inputBuffer.getChannelData(0);chunks.push(new Float32Array(d));len+=d.length;
        if(len>=need){n.disconnect();p.disconnect();clearInterval(tick);b.classList.remove('live');b.textContent=L.rec;
          raw=new Float32Array(need);var o=0;chunks.forEach(function(ch){raw.set(ch.subarray(0,Math.min(ch.length,need-o)),o);o+=ch.length;});
          clip={id:Date.now(),name:(window.ikName?ikName('diktatfaune','wav'):'diktatfaune.wav').replace(/\.wav$/,'')};render();play();}};
      n.connect(p);p.connect(c.destination);}).catch(function(){msg(L.nomic);});};

  /* hauteur et vitesse indépendantes : étirement par grains (fenêtres de Hann) puis rééchantillonnage */
  function stretch(x,f){var N=2048,H=N/4,w=new Float32Array(N);for(var i=0;i<N;i++)w[i]=.5-.5*Math.cos(2*Math.PI*i/N);
    var outLen=Math.max(N,Math.round(x.length*f)),y=new Float32Array(outLen+N),nrm=new Float32Array(outLen+N);
    for(var po=0;po<outLen;po+=H){var pi=Math.round(po/f);if(pi+N>x.length)pi=Math.max(0,x.length-N);for(var k=0;k<N;k++){var v=x[pi+k]||0;y[po+k]+=v*w[k];nrm[po+k]+=w[k];}}
    for(var j=0;j<y.length;j++)if(nrm[j]>1e-3)y[j]/=nrm[j];return y.subarray(0,outLen);}
  function resample(x,r){var n=Math.floor(x.length/r),y=new Float32Array(n);for(var i=0;i<n;i++){var p=i*r,a=Math.floor(p),t=p-a;y[i]=(x[a]||0)*(1-t)+(x[a+1]||0)*t;}return y;}
  function render(){if(!raw)return;var semi=+$('pitch').value,sp=Math.pow(2,+$('speed').value/4),r=Math.pow(2,semi/12);
    var y=stretch(raw,r/sp);y=resample(y,r);if(rev){y=y.slice().reverse();}
    var pk=0;for(var i=0;i<y.length;i++)pk=Math.max(pk,Math.abs(y[i]));if(pk>0)for(i=0;i<y.length;i++)y[i]=y[i]/pk*.92;
    out=y;draw();$('play').disabled=$('save').disabled=false;
    /* le son, tel qu'il sonne maintenant, rejoint Musik (les cinq derniers) */
    if(clip&&window.__borneDiktat)__borneDiktat.put({id:clip.id,name:clip.name,t:Date.now(),sr:ac().sampleRate,data:out});}
  function draw(){var c=$('wave'),g=c.getContext('2d');g.clearRect(0,0,c.width,c.height);if(!out)return;g.strokeStyle='#ffa726';g.lineWidth=2;g.beginPath();
    var st=Math.max(1,Math.floor(out.length/c.width));for(var x=0;x<c.width;x++){var m=0;for(var k=0;k<st;k++)m=Math.max(m,Math.abs(out[x*st+k]||0));g.moveTo(x,c.height/2-m*c.height/2);g.lineTo(x,c.height/2+m*c.height/2);}g.stroke();}
  function play(){if(!out)return;var c=ac();if(src)try{src.stop();}catch(e){}var b=c.createBuffer(1,out.length,c.sampleRate);b.getChannelData(0).set(out);src=c.createBufferSource();src.buffer=b;src.connect(c.destination);src.start();}
  function lbl(){$('pl').textContent=L.p+' '+(+$('pitch').value>0?'+':'')+$('pitch').value;$('sl').textContent=L.s+' ×'+Math.pow(2,+$('speed').value/4).toFixed(2).replace(/\.?0+$/,'');}
  ['pitch','speed'].forEach(function(id){$(id).oninput=lbl;$(id).onchange=function(){render();play();};});lbl();
  $('dir').onclick=function(){rev=!rev;this.textContent=rev?L.bw:L.fw;this.classList.toggle('on',rev);render();play();};
  $('play').onclick=play;
  $('save').onclick=function(){if(!out)return;var sr=ac().sampleRate,n=out.length,buf=new ArrayBuffer(44+n*2),v=new DataView(buf);
    function s(o,t){for(var i=0;i<t.length;i++)v.setUint8(o+i,t.charCodeAt(i));}
    s(0,'RIFF');v.setUint32(4,36+n*2,true);s(8,'WAVE');s(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);s(36,'data');v.setUint32(40,n*2,true);
    for(var i=0;i<n;i++)v.setInt16(44+i*2,Math.max(-1,Math.min(1,out[i]))*32767,true);
    var a=document.createElement('a'),u=URL.createObjectURL(new Blob([buf],{type:'audio/wav'}));a.href=u;a.download=clip?clip.name+'.wav':(window.ikName?ikName('diktatfaune','wav'):'diktatfaune.wav');document.body.appendChild(a);a.click();setTimeout(function(){a.remove();URL.revokeObjectURL(u);},2000);};
})();
</script>
</body>
</html>
