<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mauk Tenieb — Bio</title>
<link href="fonts.css" rel="stylesheet">
<style>
/* Bio (lot 7, 10 nov. 2026) : une feuille dactylographiée posée dans la salle, sous la lumière ambre du tube ; DM Mono pour le texte, Bebas Neue pour les titres (DA.md) */
html{background:#0b0908}
body{margin:0;min-height:100vh;color:#231d17;font:400 15px/1.7 "DM Mono",ui-monospace,monospace;
  background:radial-gradient(120% 60% at 50% -10%,rgba(255,167,38,.16),rgba(255,167,38,0) 60%),#0b0908}
main{position:relative;max-width:720px;margin:28px auto 56px;padding:52px 56px 48px;box-sizing:border-box;
  background:
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35  0 0 0 0 .27  0 0 0 0 .17  0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='.38'/></svg>"),
    radial-gradient(140% 90% at 50% 0%,rgba(255,236,200,.55),rgba(255,236,200,0) 55%),
    linear-gradient(180deg,#efe4cc 0%,#e7d9bb 70%,#dccaa5 100%);
  box-shadow:0 1px 0 rgba(255,240,210,.4) inset,0 -18px 40px rgba(120,84,40,.12) inset,0 22px 40px rgba(0,0,0,.65),0 6px 10px rgba(0,0,0,.5);
  border-radius:2px}
main::before{content:"";position:absolute;left:0;right:0;top:33%;height:1px;background:linear-gradient(90deg,rgba(90,64,30,0),rgba(90,64,30,.18) 20%,rgba(90,64,30,.18) 80%,rgba(90,64,30,0));pointer-events:none}
main::after{content:"";position:absolute;left:0;right:0;top:66%;height:1px;background:linear-gradient(90deg,rgba(90,64,30,0),rgba(90,64,30,.14) 20%,rgba(90,64,30,.14) 80%,rgba(90,64,30,0));pointer-events:none}
h1{font:400 3.2rem/1 "Bebas Neue",Impact,sans-serif;letter-spacing:.06em;margin:0 0 14px;color:#1a1410}
h2{font:400 1.6rem/1.1 "Bebas Neue",Impact,sans-serif;letter-spacing:.08em;margin:30px 0 8px;padding-top:12px;border-top:1px dashed rgba(60,44,26,.45);color:#1a1410}
h3{font:400 1.25rem/1.1 "Bebas Neue",Impact,sans-serif;letter-spacing:.08em;margin:22px 0 6px}
p{margin:.55em 0}
b{font-weight:400;color:#120d09;text-shadow:.35px 0 0 #120d09,-.35px 0 0 #120d09}
ul{margin:.4em 0;padding-left:1.3em;list-style:"– "}
li{margin:.3em 0}
a{color:#8a2418;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px;padding:13px 5px;margin:-13px -5px;-webkit-tap-highlight-color:rgba(201,48,42,.18)}
a:hover,a:focus-visible{color:#c9302a}
a:focus-visible{outline:2px solid #c9302a;outline-offset:2px}
.src{margin-top:36px;font-size:12px;letter-spacing:.08em;color:#5d4f3e}
@media (max-width:640px){body{font-size:14px}main{margin:12px 10px 32px;padding:30px 20px 30px}h1{font-size:2.6rem}h2{font-size:1.4rem}}
@media print{html,body{background:#fff}main{max-width:none;margin:0;padding:0;background:none;box-shadow:none}main::before,main::after{display:none}a{color:#000;text-decoration:none;padding:0;margin:0}a::after{content:" (" attr(href) ")";font-size:10px;color:#555}.src{display:none}}
</style>
</head>
<body>
<main id="m"><p>…</p></main>
<script>
/* Bio : le profil GitHub de Mauk Tenieb, lu en direct (README de MaukTenieb/MaukTenieb), mis en page pour l'écran et l'impression. */
(function(){
  var SRC='https://raw.githubusercontent.com/MaukTenieb/MaukTenieb/main/README.md',m=document.getElementById('m');
  function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function inl(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2">$1</a>');}
  function md(t){t=t.replace(/<!--[\s\S]*?-->/g,'');var out=[],list=false,para=[];
    function flush(){if(para.length){out.push('<p>'+inl(para.join(' '))+'</p>');para=[];}}
    t.split(/\r?\n/).forEach(function(l){var h=l.match(/^(#{1,3})\s+(.*)$/),li=l.match(/^\s*[-*]\s+(.*)$/);
      if(h){flush();if(list){out.push('</ul>');list=false;}out.push('<h'+h[1].length+'>'+inl(h[2])+'</h'+h[1].length+'>');}
      else if(li){flush();if(!list){out.push('<ul>');list=true;}out.push('<li>'+inl(li[1])+'</li>');}
      else if(!l.trim()){flush();if(list){out.push('</ul>');list=false;}}
      else para.push(l.trim());});
    flush();if(list)out.push('</ul>');return out.join('\n');}
  fetch(SRC,{cache:'no-cache'}).then(function(r){if(!r.ok)throw 0;return r.text();}).then(function(t){
    m.innerHTML=md(t)+'<p class="src">github.com/MaukTenieb</p>';document.title=(m.querySelector('h1')||{}).textContent||document.title;
  }).catch(function(){m.innerHTML='<h1>Mauk Tenieb</h1><p><a href="https://github.com/MaukTenieb">github.com/MaukTenieb</a></p>';});
})();
</script>
</body>
</html>
