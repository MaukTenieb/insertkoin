 Photofauna + FaunAI — code under the MIT License. The names Photofauna, FaunAI, Insert Koin, Korhogo and Korhogo Fauna, the marks and every Korhogo image remain the property of Mauk Tenieb & Korhogo.
 Direction artistique : herbier au cyanotype (Anna Atkins, Photographs of British Algae, 1843) — fond bleu de Prusse, étiquettes de papier, spécimens rangés par famille et genre.

<style>
:root{
 --prusse:#0e2a45;--prusse2:#12365a;--fosse:#081c30;--trait:#2a5179;--cyan:#9cc0da;--papier:#eee8da;--encre:#16202e;--or:#d6b057;--vert:#b9d84a;--ok:#9be3a8;--err:#ffb0a0;
 --sans:"Archivo","Helvetica Neue",Arial,sans-serif;--titre:"Bebas Neue",Impact,"Arial Narrow",sans-serif;--chiffre:"DM Mono",ui-monospace,Menlo,monospace;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--prusse)}
body{color:var(--papier);font:400 14px/1.45 var(--sans);min-height:100vh;
 background:var(--prusse) radial-gradient(120% 80% at 70% 0%,#15406a 0%,var(--prusse) 55%,#0a223a 100%) fixed}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--or);outline-offset:2px}
[hidden]{display:none!important}
.app{display:grid;gap:14px 18px;max-width:1500px;margin:0 auto;padding:max(10px,env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) 40px max(14px,env(safe-area-inset-left,0px));
 grid-template-columns:minmax(0,1fr);grid-template-areas:"head" "stage" "ask" "index" "specs" "labo" "reel" "foot"}
@media (min-width:1100px){.app{grid-template-columns:210px minmax(0,1fr) 380px;grid-template-areas:"head head head" "index stage specs" "index ask specs" "index labo specs" "index reel specs" "foot foot foot";align-items:start}}
/* en-tête */
header{grid-area:head;display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-bottom:1px solid var(--trait);padding-bottom:8px}
h1{margin:0;font:400 clamp(30px,4.6vw,48px)/.9 var(--titre);letter-spacing:.04em;color:var(--papier)}
h1 span{color:var(--cyan)}
.hd{display:flex;gap:8px;align-items:center}
.lnk{background:none;border:1px solid var(--trait);padding:6px 10px;cursor:pointer;color:var(--cyan);font-size:12px}
.lnk:hover{border-color:var(--cyan);color:var(--papier)}
/* index taxonomique */
.index{grid-area:index;display:flex;flex-direction:column;gap:10px;min-width:0}
@media (min-width:1100px){.index{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto;scrollbar-width:thin}}
.search{display:flex;gap:6px}
#q{flex:1;min-width:0;background:var(--fosse);border:1px solid var(--trait);padding:8px 10px;color:var(--papier);border-radius:0}
#q::placeholder{color:#6f93b0}
.fams{display:flex;flex-wrap:wrap;gap:5px}
.fam{flex:0 0 auto;display:flex;align-items:baseline;gap:6px;background:none;border:1px solid var(--trait);padding:6px 9px;cursor:pointer;text-align:left;color:var(--cyan)}
.fam span{font:500 14px/1.15 var(--sans)}
.fam small{font:300 12px var(--sans);color:#7b9cb8}
.fam:hover{color:var(--papier);border-color:var(--cyan)}
.fam[aria-pressed="true"]{color:var(--encre);background:var(--papier);border-color:var(--papier)}
.fam[aria-pressed="true"] small{color:#4a5a6e}
@media (min-width:1100px){.fams{flex-direction:column;flex-wrap:nowrap;gap:0}.fam{border:0;border-left:2px solid transparent;padding:7px 10px;justify-content:space-between}.fam[aria-pressed="true"]{border-left-color:var(--or);background:rgba(238,232,218,.07);color:var(--papier)}.fam[aria-pressed="true"] small{color:var(--cyan)}}
.count{font:italic 300 12.5px var(--sans);color:#7b9cb8;margin:0}
.rand{background:none;border:1px dashed var(--trait);color:var(--cyan);padding:7px 10px;cursor:pointer;text-align:left}
.rand:hover{border-color:var(--or);color:var(--papier)}
/* scène : la planche */
.stage{grid-area:stage;position:relative;background:var(--fosse);border:1px solid var(--trait);display:grid;place-items:center;min-height:200px;max-height:74vh;overflow:hidden;touch-action:none;user-select:none;cursor:crosshair}
.stage canvas,.stage video{display:block;max-width:100%;max-height:74vh;width:auto;height:auto}
/* téléphone : la planche reste en haut pendant qu'on parcourt les spécimens */
@media (max-width:1099px){.stage{position:sticky;top:0;z-index:4;max-height:46vh;box-shadow:0 8px 18px rgba(4,14,26,.55)}.stage canvas,.stage video{max-height:46vh}}
.stage video{position:absolute;inset:0;margin:auto;background:#000}
.stage #cmpOrig,.stage #cropOv{position:absolute;inset:0;margin:auto;pointer-events:none}
.stage #cmpBar{position:absolute;top:0;bottom:0;width:2px;background:var(--or);pointer-events:none}
.busy{position:absolute;left:0;right:0;bottom:0;height:3px;overflow:hidden;background:transparent}
.busy i{position:absolute;inset:0 auto 0 0;width:28%;background:var(--or)}
@media (prefers-reduced-motion:no-preference){.busy i{animation:sl 1.1s ease-in-out infinite}}
@keyframes sl{from{left:-28%}to{left:100%}}
/* étiquette d'herbier : papier, encre, posée sur la planche */
.label{position:absolute;left:12px;bottom:12px;max-width:min(340px,70%);background:var(--papier);color:var(--encre);padding:7px 11px 8px;box-shadow:0 1px 0 rgba(0,0,0,.25),0 6px 18px rgba(0,0,0,.35);pointer-events:none;transform:rotate(-.6deg)}
.label p{margin:0}
.label .lf{font:italic 300 11.5px/1.3 var(--sans);color:#3a4a5e}
.label .ln{font:400 25px/1 var(--titre);letter-spacing:.02em;margin-top:2px}
.label .ls{font:italic 400 12px/1.3 var(--sans);color:#3a4a5e}
.label .lh{font:400 11.5px/1.3 var(--sans);color:#7a5a12;margin-top:3px}
.stage .corner{position:absolute;right:10px;top:10px;display:flex;gap:6px}
.stage .corner button{background:rgba(8,28,48,.82);border:1px solid var(--trait);color:var(--papier);padding:6px 10px;cursor:pointer;font-size:12.5px}
.stage .corner button[aria-pressed="true"]{border-color:var(--or);color:var(--or)}
.sh{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);width:66px;height:66px;border-radius:50%;border:4px solid var(--papier);background:rgba(238,232,218,.2);cursor:pointer}
.flashFx{position:absolute;inset:0;background:#fff;transition:opacity .3s;pointer-events:none}
#gl,#cam{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;left:-9px;top:-9px}
.ctl .ctlrow{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:flex-end;padding:8px 10px;border:1px solid var(--trait);background:rgba(8,28,48,.55)}
.ctl .cr{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--cyan);min-width:120px;flex:1 1 140px}
.ctl .cr input[type=range]{width:100%;accent-color:var(--or)}
.ctl select{font-size:13px;color:var(--papier);background:var(--fosse);border:1px solid var(--trait);padding:5px 6px;border-radius:0;width:100%}
.ctl .chip{flex:0 0 auto}
.ctl .ctlmore{margin-top:6px}.ctl .ctlmore summary{cursor:pointer;font-size:12px;color:var(--cyan);padding:4px 10px}
.ctl:empty{display:none}
/* outils et FaunAI */
.ask{grid-area:ask;display:flex;flex-direction:column;gap:8px;min-width:0}
.tools{display:flex;gap:6px}.tools .btn{flex:1 1 0}.tools .btn.labo{flex:0 0 auto}
.btn{font:600 14px/1.1 var(--sans);border:1px solid var(--trait);background:var(--prusse2);color:var(--papier);padding:11px 8px;cursor:pointer;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn:hover{border-color:var(--cyan)}
.btn.main{background:var(--papier);color:var(--encre);border-color:var(--papier)}
.btn.labo{background:none;border-color:var(--or);color:var(--or);padding-inline:14px}
.btn.labo[aria-expanded="true"]{background:var(--or);color:var(--encre)}
.btn.vid{background:var(--vert);color:#17210a;border-color:var(--vert)}
.btn[disabled]{opacity:.35;cursor:default}
.row{display:flex;gap:6px}
#prompt{flex:1;min-width:0;background:var(--fosse);border:1px solid var(--trait);padding:10px 12px;color:var(--papier);border-radius:0}
#prompt::placeholder{color:#6f93b0}
.row .btn{flex:0 0 auto;padding-inline:16px}
.status{min-height:18px;font-size:12.5px;color:var(--cyan);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.status.err{color:var(--err)} .status.ok{color:var(--ok)}
#stopAi{background:none;border:1px solid var(--trait);color:var(--papier);padding:3px 8px;cursor:pointer}
@media (max-width:600px){.label{left:8px;bottom:8px;padding:5px 8px}.label .ln{font-size:19px}.label .lf,.label .ls{font-size:10.5px}.tools{flex-wrap:wrap}.tools .btn{flex:1 1 22%}.tools .btn.labo{flex:1 1 100%}.btn{font-size:13px;padding:11px 2px}.row{flex-wrap:wrap}#prompt{flex-basis:100%}.row .btn{flex:1 1 0}}
/* spécimens */
.specs{grid-area:specs;display:flex;flex-direction:column;gap:10px;min-width:0}
@media (min-width:1100px){.specs{position:sticky;top:12px;max-height:calc(100vh - 24px)}}
.gtitle{margin:0;font:600 20px/1.15 var(--sans);color:var(--papier)}
p.gtitle{font:italic 300 15px/1.3 var(--sans);color:var(--cyan)}
.gchips{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.gchip{flex:0 0 auto;background:none;border:1px solid var(--trait);color:var(--cyan);padding:5px 9px;cursor:pointer;font-size:12.5px}
.gchip small{font:300 11.5px var(--sans);opacity:.75}
.gchip:hover{color:var(--papier)}
.gchip[aria-pressed="true"]{background:var(--papier);color:var(--encre);border-color:var(--papier)}
/* chaque spécimen : vignette collée sur une fiche de papier, nom à l'encre */
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;align-content:start}
@media (min-width:640px) and (max-width:1099px){.grid{grid-template-columns:repeat(auto-fill,minmax(132px,1fr))}}
@media (min-width:1100px){.grid{overflow-y:auto;overflow-x:hidden;padding:2px 6px 8px 2px;scrollbar-width:thin}}
.spec{display:flex;flex-direction:column;gap:4px;background:var(--papier);border:0;padding:5px 5px 7px;cursor:pointer;text-align:left;min-width:0;color:var(--encre);box-shadow:0 1px 0 rgba(0,0,0,.3),0 3px 10px rgba(0,0,0,.25)}
.spec img,.spec .ph{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:#d9d2c2}
.spec:hover{background:#fff8ea}
.spec[aria-pressed="true"]{outline:3px solid var(--or);outline-offset:2px}
.spec b{font:600 11.5px/1.25 var(--sans);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.spec i{font:italic 300 10.5px/1.25 var(--sans);color:#4a5a6e;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
/* Labo */
.labo{grid-area:labo;border:1px solid var(--or);background:rgba(8,28,48,.6)}
.labo nav{display:flex;border-bottom:1px solid var(--trait);overflow-x:auto}
.labo nav button{flex:1 0 auto;background:none;border:0;border-right:1px solid var(--trait);padding:10px 12px;cursor:pointer;color:var(--cyan);font:600 13.5px/1 var(--sans)}
.labo nav button[aria-selected="true"]{background:var(--or);color:var(--encre)}
.labo .body{padding:14px;display:flex;flex-direction:column;gap:12px}
.labo h3{margin:4px 0 0;font:600 15px/1.2 var(--sans);color:var(--or)}
.labo .slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px 14px}
.labo .sl{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--cyan)}
.labo select,.labo input[type=text]{font-size:13px;color:var(--papier);background:var(--fosse);border:1px solid var(--trait);padding:7px 8px;border-radius:0;width:100%}
.labo .sls{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:6px 16px}
.labo .rg{display:flex;flex-direction:column;gap:1px;font-size:12px;color:var(--cyan)}
.labo .rg input{width:100%;accent-color:var(--or)}
.labo .row{flex-wrap:wrap}
.labo .btn.sm{font-size:13px;padding:8px 12px}
.chip{background:none;border:1px solid var(--trait);color:var(--papier);padding:6px 9px;cursor:pointer;font-size:12.5px}
.chip[aria-pressed="true"]{background:var(--or);color:var(--encre);border-color:var(--or)}
.labo .hsl{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.labo .hc b{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600}
.labo .hc b::before{content:"";width:10px;height:10px;background:var(--c)}
.labo .curves canvas{width:min(100%,320px);aspect-ratio:1;border:1px solid var(--trait);touch-action:none;cursor:crosshair;margin-top:6px}
.labo .tool{border-top:1px solid var(--trait);padding-top:8px;display:flex;flex-direction:column;gap:8px}
.hint{font-size:12.5px;color:var(--cyan);margin:0;max-width:72ch}
#keysForm label{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--cyan);margin:6px 0}
#keysForm input{padding:8px 10px;background:var(--fosse);color:var(--papier);border:1px solid var(--trait);border-radius:0}
#keysForm a{color:var(--or)} #keysForm p{font-size:12.5px;color:var(--cyan);margin:6px 0}
/* pellicule FaunAI */
.reel{grid-area:reel;display:flex;flex-direction:column;gap:6px}
.reel h2{margin:0;font:600 15px/1.2 var(--sans);color:var(--cyan)}
.film{display:grid;grid-auto-flow:column;grid-auto-columns:88px;gap:6px;overflow-x:auto;padding-bottom:4px}
.film .it{position:relative;border:1px solid var(--trait);background:#000;cursor:pointer;padding:0;aspect-ratio:1;overflow:hidden}
.film .it img,.film .it video{width:100%;height:100%;object-fit:cover;display:block}
.film .it b{position:absolute;left:3px;bottom:3px;font-size:10px;background:rgba(8,28,48,.85);padding:1px 4px}
.film .it .x{position:absolute;right:2px;top:2px;font-size:11px;background:rgba(8,28,48,.85);border:0;padding:1px 5px;cursor:pointer;color:var(--papier)}
footer{grid-area:foot;font-size:12px;color:#6f93b0;border-top:1px solid var(--trait);padding-top:10px}
footer a{color:var(--cyan)}
</style>
</head>
<body>
<div class="app">
 <header>
  <h1>Photofauna <span>+ FaunAI</span></h1>
  <div class="hd"><button class="lnk" id="lang" type="button">EN</button></div>
 </header>

 <aside class="index" aria-label="Index">
  <div class="search"><input id="q" type="search" data-ph="search" autocomplete="off" aria-label="Search"></div>
  <nav class="fams" id="fams"></nav>
  <button class="rand" id="bRand" type="button" data-i="random"></button>
  <p class="count" id="count"></p>
 </aside>

 <section class="stage" id="stage" aria-label="Photo">
  <canvas id="view"></canvas>
  <canvas id="cmpOrig" hidden></canvas><div id="cmpBar" hidden></div>
  <canvas id="cropOv" hidden></canvas>
  <video id="player" hidden controls loop playsinline></video>
  <div class="label" id="label"><p class="lf" id="lbFam"></p><p class="ln" id="lbName"></p><p class="ls" id="lbSrc"></p><p class="lh" id="lbHint"></p></div>
  <div class="corner"><button id="cmpBtn" type="button" aria-pressed="false" data-i="compare"></button><button id="closeVid" type="button" hidden>✕</button></div>
  <button class="sh" id="shutter" type="button" hidden aria-label="Shutter"></button>
  <div class="flashFx" id="flashFx" hidden></div>
  <div class="busy" id="busy" hidden><i></i></div>
 </section>

 <section class="ask">
  <div class="ctl" id="ctl"></div>
  <div class="tools">
   <button class="btn" id="bOpen" type="button" data-i="open"></button>
   <button class="btn" id="bShoot" type="button" data-i="shoot"></button>
   <button class="btn" id="bUndo" type="button" data-i="undo"></button>
   <button class="btn main" id="bSave" type="button" data-i="save"></button>
   <button class="btn labo" id="laboBtn" type="button" aria-expanded="false" data-i="labo"></button>
  </div>
  <div class="row">
   <input id="prompt" type="text" data-ph="ph" autocomplete="off" aria-label="Prompt">
   <button class="btn" id="goImg" type="button" data-i="img"></button>
   <button class="btn vid" id="goVid" type="button" data-i="vid"></button>
  </div>
  <div class="status" id="status" aria-live="polite"><span id="stText"></span><button id="stopAi" type="button" hidden data-i="stop"></button></div>
 </section>

 <section class="specs" aria-label="Specimens">
  <div id="genres"></div>
  <div class="grid" id="grid"></div>
 </section>

 <section class="labo" id="labo" hidden>
  <nav id="laboTabs" role="tablist">
   <button type="button" role="tab" data-t="compose" data-i="t_compose"></button><button type="button" role="tab" data-t="retouch" data-i="t_retouch"></button><button type="button" role="tab" data-t="tools" data-i="t_tools"></button><button type="button" role="tab" data-t="export" data-i="t_export"></button><button type="button" role="tab" data-t="keys" data-i="t_keys"></button>
  </nav>
  <div class="body" id="laboBody"></div>
 </section>

 <section class="reel" id="reel" hidden>
  <h2 data-i="reel"></h2>
  <div class="film" id="film"></div>
 </section>

 <footer><span data-i="foot"></span> · <a href="https://mauktenieb.github.io/insertkoin/">Insert Koin</a> · <a href="https://github.com/MaukTenieb">github.com/MaukTenieb</a> · © Mauk Tenieb &amp; Korhogo</footer>
</div>

<canvas id="gl"></canvas><video id="cam" playsinline muted></video>
<input type="file" id="fOpen" accept="image/*" hidden>
<input type="file" id="fShoot" accept="image/*" capture="environment" hidden>
<input type="file" id="fSecond" accept="image/*" hidden>

<div id="keysForm" hidden>
 <label><span>Hugging Face · <a href="https://huggingface.co/settings/tokens" target="_blank" rel="noopener">https://huggingface.co/settings/tokens</a></span><input type="password" id="k_hf" autocomplete="off" placeholder="hf_…"></label>
 <label><span>Pollinations · <a href="https://enter.pollinations.ai/" target="_blank" rel="noopener">https://enter.pollinations.ai/</a></span><input type="password" id="k_pol" autocomplete="off" placeholder="sk_…"></label>
 <label><span>AI Horde · <a href="https://aihorde.net/register" target="_blank" rel="noopener">https://aihorde.net/register</a></span><input type="password" id="k_horde" autocomplete="off" placeholder="0000000000"></label>
 <p id="engSum"></p>
 <p id="puterSum"></p>
 <div class="row"><button class="chip" id="census" type="button" data-i="census"></button><span class="status" id="censusSt"></span></div>
</div>

<script type="text/plain" id="engine-src">/* ==== MOTEUR : noyau ====
   Image = {w,h,d:Uint8ClampedArray RGBA}. Tout est calculé sur CPU (déterministe au pixel près
   sur un même moteur JS). Unité spatiale : fraction du plus petit côté. */
'use strict';
var OPS = {};
var REG = null;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hashStr(s){var h=2166136261>>>0;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function ihash(x,y,s){var h=Math.imul(x|0,374761393)+Math.imul(y|0,668265263)+Math.imul(s|0,2246822519)|0;h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return (h>>>0)/4294967296;}
var clamp=function(v,a,b){return v<a?a:v>b?b:v;};
var sstep=function(a,b,x){var t=clamp((x-a)/(b-a||1e-9),0,1);return t*t*(3-2*t);};
var mix=function(a,b,t){return a+(b-a)*t;};
function newImg(w,h,fill){var d=new Uint8ClampedArray(w*h*4);if(fill){for(var i=0;i<d.length;i+=4){d[i]=fill[0];d[i+1]=fill[1];d[i+2]=fill[2];d[i+3]=255;}}else{for(var j=3;j<d.length;j+=4)d[j]=255;}return {w:w,h:h,d:d};}

/* ==== Photofauna + FaunAI : passes reconstituées d'après les applis 2010 ====
   Chaque passe : shader GLSL (GPU_EXT_FS) + fonction d'appel (GPU_EXT). Les fonctions reçoivent
   l'étape s et {swap,E,w,h,ctx,cur} ; swap(nom,uniformes,textures) applique un shader à l'image courante. */
"use strict";
const GPU_EXT_FS={
/* Procédés historiques (portage sur carte graphique de l'opération « histo ») : sensibilité spectrale, courbe, virage,
   support, défauts, miroir et ternissure du daguerréotype ; le bord suit dans « hedge » */
histo:`uniform sampler2D A;uniform sampler2D CV;uniform int flip,neg,keep,paperK,TN;uniform vec3 Wt;uniform vec3 TC[6];uniform float TP[6];
uniform float irVeg,irSky,hal,fade,mottle,streak,grain,gsize,paperAmt,yellow,fadeEdge,silver,mirror,tarnish,cracks,fox,vign,soft,swirl,diffuse;
float ed(vec2 px){return min(min(px.x,R.x-px.x),min(px.y,R.y-px.y));}
void main(){vec2 uv=flip==1?vec2(1.-v.x,v.y):v;float u=U();vec2 px=v*R;vec2 pu=px/u;
 vec3 c=texture(A,uv).rgb;
 if(diffuse>0.)c=mix(c,textureLod(A,uv,log2(max(1.,u*diffuse))+1.).rgb,.75);
 if(soft>0.||swirl>0.){vec2 d=(uv-.5)*R;float r=length(d)/length(R*.5);float k=smoothstep(.22,1.,r);vec2 t=normalize(vec2(-d.y,d.x)+1e-5);vec3 s2=vec3(0);float off=swirl*.02*k*k;
  for(int i=0;i<5;i++){float o=(float(i)/4.-.5)*2.*off;s2+=textureLod(A,uv+t*o*u/R,log2(max(1.,u*.003*(1.+soft*4.)))).rgb;}c=mix(c,s2/5.,min(1.,k*(soft*.9+swirl*.8)));}
 float L0=dot(c,Wt)/max(Wt.x+Wt.y+Wt.z,1e-3);
 if(irVeg>0.){float veg=max(0.,c.g-max(c.r,c.b))*3.+max(0.,c.g-c.b)*.5;L0+=irVeg*veg*(.5+c.g);}
 if(irSky>0.)L0-=irSky*max(0.,c.b-max(c.r,c.g))*2.2;
 if(hal>0.){vec3 hb=textureLod(A,uv,log2(max(1.,u*.012))+1.).rgb;L0+=smoothstep(.62,1.,dot(hb,Wt)/max(Wt.x+Wt.y+Wt.z,1e-3))*hal*.7;}
 float L=clamp(L0,0.,1.);if(neg==1)L=1.-L;
 L=texture(CV,vec2(L*255./256.+.5/256.,.5)).a;if(fade>0.)L=fade*.2+L*(1.-fade*.38);
 if(mottle>0.)L=clamp(L+(fbm(pu*4.+SEED)-.5)*mottle*.35,0.,1.);
 if(streak>0.)L=clamp(L+(vn(vec2(pu.x*40.,.5+SEED))-.5)*streak*.18*(.6+.4*v.y),0.,1.);
 if(grain>0.){float gn=gsize<=1.05?h12(px+SEED):vn(px/gsize+SEED)*.75+h12(px+SEED*2.)*.25;L=clamp(L+(gn-.5)*grain*(.35+2.6*L*(1.-L)),0.,1.);}
 vec3 col=TC[0];for(int i=1;i<6;i++){if(i>=TN)break;float a=TP[i-1],b=TP[i];if(L>=a){col=mix(TC[i-1],TC[i],clamp((L-a)/max(b-a,1e-4),0.,1.));}}
 if(keep==1)col=c;
 if(paperK>0&&paperAmt>0.){float pv=fbm(pu*(paperK==3?22.:70.)/4.+SEED)-.5;
  if(paperK==1)pv=pv*.6+(vn(vec2(pu.x*420.,pu.y*30.)+SEED)-.5)*.5+(h12(px)-.5)*.15;
  else if(paperK==2)pv=pv*.3+(vn(vec2(pu.x*6.,pu.y*700.)+SEED)-.5)*.35+(h12(px)-.5)*.2;
  else if(paperK==3)pv=pv*1.2+(h12(px)-.5)*.2;else if(paperK==5)pv*=.2;
  col*=1.+paperAmt*pv*(.25+.6*L);}
 if(yellow>0.){float yk=yellow*pow(L,1.4);col.g*=1.-.07*yk;col.b*=1.-.3*yk;}
 if(fadeEdge>0.){float ek=clamp(fadeEdge*(1.-smoothstep(0.,u*.22,ed(px)))*(.6+.8*vn(pu*5.+SEED)),0.,1.);col=mix(col,TC[TN-1],ek);}
 if(silver>0.){float sk=clamp(silver*pow(1.-L,2.)*(1.-smoothstep(0.,u*.2,ed(px)))*(.5+vn(pu*12.+SEED)),0.,.85);col=mix(col,vec3(.59,.63,.69),sk);}
 if(mirror>0.){float g=clamp(.25+.75*(v.x*.6+(1.-v.y)*.4),0.,1.);col=mix(col,vec3(.77,.78,.8),mirror*pow(1.-L,1.3)*g);}
 if(tarnish>0.){float e2=ed(px)/u;float tk=1.-smoothstep(.02,.2+.06*vn(pu*4.+SEED),e2);vec3 hc=hsv2rgb(vec3(.08+.62*(1.-tk)+.05*vn(pu*9.+SEED),.65,.9));col=mix(col,hc,tarnish*tk*.7);}

/* Insert Koin: every saved file is named after the French Republican calendar, then the program, then a counter of the day:
   18-vendemiaire-235_photofauna_001.png
   Years III, VII, XI and XV were sextile (as kept in their day); from XX on, Romme's rule (every 4th year, but not the 100th unless the 400th, nor the 4000th).
   The date is the visitor's own local day. The counter lives in the browser (ik.saves), per program and per day. */
(function(){
  var MONTHS=['vendemiaire','brumaire','frimaire','nivose','pluviose','ventose','germinal','floreal','prairial','messidor','thermidor','fructidor','sansculottides'];
  function sextile(y){if(y<20)return y===3||y===7||y===11||y===15;return y%4===0&&(y%100!==0||y%400===0)&&y%4000!==0;}
  function rep(d){d=d||new Date();var n=Math.round((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())-Date.UTC(1792,8,22))/864e5),y=1;
    if(n<0)return null;for(;;){var L=sextile(y)?366:365;if(n<L)break;n-=L;y++;}return{year:y,month:Math.floor(n/30)+1,day:n%30+1};}
  function repDate(d){var r=rep(d);return r?r.day+'-'+MONTHS[r.month-1]+'-'+r.year:'0';}
  function ikName(prog,ext,d){var date=repDate(d),k=date+'|'+prog,n=1,m={};
    try{m=JSON.parse(localStorage.getItem('ik.saves')||'{}')||{};Object.keys(m).forEach(function(x){if(x.split('|')[0]!==date)delete m[x];});n=(m[k]||0)+1;m[k]=n;localStorage.setItem('ik.saves',JSON.stringify(m));}catch(e){n=1+Math.floor(Math.random()*999);}
    return date+'_'+prog+'_'+String(n).padStart(3,'0')+(ext?'.'+String(ext).replace(/^\./,''):'');}
  window.ikRep=rep;window.ikRepDate=repDate;window.ikName=ikName;
})();

function faceGuess(im){try{const W=im.width,H=im.height,d=im.data,N=20,cs=new Float32Array(N*N),cn=new Float32Array(N*N);
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){const i=(y*W+x)*4,r=d[i],g=d[i+1],b=d[i+2],cb=128-.169*r-.331*g+.5*b,cr=128+.5*r-.419*g-.081*b;const k=Math.min(N-1,Math.floor(y/H*N))*N+Math.min(N-1,Math.floor(x/W*N));cn[k]++;if(cr>138&&cr<173&&cb>77&&cb<127&&r>60)cs[k]++}

const CROP={ratio:0,rot:0,ox:0,oy:0};

 const r=cropRect(o.width,o.height);g.fillStyle="rgba(7,6,10,.62)";g.fillRect(0,0,o.width,o.height);g.clearRect(r.x,r.y,r.w,r.h);g.strokeStyle="#efe6cf";g.lineWidth=Math.max(1,o.width/500);g.strokeRect(r.x,r.y,r.w,r.h);

async function keepReel(o){const it={id:Date.now()+"-"+Math.random().toString(36).slice(2,7),ts:Date.now(),...o};await DB.put(it);REEL.unshift(it);drawReel();return it}
function drawReel(){const box=$("film");box.textContent="";$("reel").hidden=!REEL.length;
 for(const it of REEL){const b=document.createElement("div");b.className="it";b.title=it.prompt||"";const s=srcOf(it);
  b.innerHTML=(it.type==="video"?`<video src="${esc(s)}" muted playsinline preload="metadata"></video>`:`<img alt="" src="${esc(s)}">`)+`<b>${t(it.type==="video"?"video":"photo")}</b><button class="x" type="button" aria-label="✕">✕</button>`;
  b.onclick=async e=>{if(e.target.classList.contains("x")){await DB.del(it.id);REEL=REEL.filter(x=>x!==it);if(CUR_VID===it)closeVideo();drawReel();return}
   if(it.type==="video")showVideo(it);else if(it.blob){pushHist();setSource(await readFile(new File([it.blob],"p.jpg",{type:it.blob.type})),true);closeVideo()}};
  box.appendChild(b)}}
function showVideo(it){CUR_VID=it;const v=$("player");v.src=srcOf(it);v.hidden=false;$("closeVid").hidden=false;$("lbName").textContent=t("video");v.play().catch(()=>{})}
function closeVideo(){const v=$("player");if(v.hidden)return;v.pause();v.hidden=true;$("closeVid").hidden=true;CUR_VID=null;setLabel()}
$("closeVid").onclick=closeVideo;

/* ---------- clés, recensement des moteurs ---------- */
for(const k of ["hf","pol","horde"]){const el=$("k_"+k);el.value=LS.get("fa_k_"+k,"");el.onchange=()=>{LS.set("fa_k_"+k,el.value.trim());if(k==="hf"){ZERO_UNTIL=0;LS.set("fa_zero",0)}drawEngines()}}
function drawEngines(){const L=engines(),v=L.filter(e=>e.modes.some(VIDEO)).length;$("engSum").textContent=t("eng_sum",{n:L.length,v,d:CENSUS?.date?new Date(CENSUS.date).toLocaleDateString(LANG):"16/10/2026"})}
async function puterCredits(){if(!window.puter||!window.puter.auth.isSignedIn()){$("puterSum").textContent=t("puter_none");return}
 try{const u=await window.puter.auth.getMonthlyUsage(),c=Math.max(0,Math.floor(u.allowanceInfo?.remaining||0));$("puterSum").textContent=t("puter_left",{c,v:Math.floor(c/320)})}catch{$("puterSum").textContent=""}}
const HF_TERMS=["flux","flux schnell","sdxl","sdxl lightning","stable diffusion","text to image","image generation","z-image","qwen image","hidream","sana","ltx video","wan2","wan 2.2","wan 2.1","text to video","image to video","video generation","cogvideox","hunyuan video","framepack","stable video diffusion"];
let CENSUS_RUN=false;
async function census(){if(CENSUS_RUN)return;CENSUS_RUN=true;$("census").disabled=true;const say=x=>$("censusSt").textContent=x;
 try{const sp={};let i=0;
  for(const term of HF_TERMS){say(t("census_run",{x:`${++i}/${HF_TERMS.length}`}));
   try{const d=await jget(`${HF}/api/spaces?search=${enc(term)}&sort=likes&direction=-1&limit=60&expand[]=runtime&expand[]=likes&expand[]=sdk&expand[]=cardData`);
    for(const x of d){const rt=x.runtime||{};if(x.sdk!=="gradio"||rt.stage!=="RUNNING"||sp[x.id])continue;const doms=(rt.domains||[]).filter(d=>d.stage==="READY").map(d=>d.domain),own=slugHost(x.id);
     sp[x.id]={id:x.id,likes:x.likes||0,title:x.cardData?.title||x.id.split("/")[1],hw:rt.hardware?.current||"",host:doms.includes(own)?own:(doms[doms.length-1]||own)}}}
   catch(e){if(/429/.test(e.message))await sleep(30000)}await sleep(500)}
  const ids=Object.keys(sp);let k=0;
  const worker=async()=>{while(k<ids.length){const s=sp[ids[k++]];say(t("census_run",{x:`API ${k}/${ids.length}`}));const inf=await hfInfo(s.host).catch(()=>null);if(!inf)continue;const c=classify(inf.info);if(!c.length)continue;s.eps={};for(const x of c)if(!s.eps[x.mode])s.eps[x.mode]=x.ep}};
  await Promise.all([worker(),worker(),worker(),worker()]);
  const spaces=Object.values(sp).filter(s=>s.eps).map(({id,likes,title,hw,eps})=>({id,likes,title,hw,eps}));
  let pol=CENSUS?.pol||[];try{pol=(await jget("https://gen.pollinations.ai/image/models")).map(m=>({name:m.name,title:m.title,category:m.category}))}catch{}
  if(spaces.length){CENSUS={date:Date.now(),spaces,pol};await DB.set("census",CENSUS)}say(t("census_done",{n:engines().length}));drawEngines()}
 finally{CENSUS_RUN=false;$("census").disabled=false}}
$("census").onclick=census;
async function faunaiStart(){CENSUS=(await DB.get("census"))||null;REEL=((await DB.all())||[]).sort((a,b)=>b.ts-a.ts);drawReel();drawEngines();
 if(!CENSUS||Date.now()-CENSUS.date>3*864e5)setTimeout(()=>census().catch(()=>{}),4000)}


/* ---------- langue, démarrage ---------- */
function i18n(){document.documentElement.lang=LANG;$("lang").textContent=LANG==="fr"?"EN":"FR";
 document.querySelectorAll("[data-i]").forEach(e=>e.textContent=t(e.dataset.i));document.querySelectorAll("[data-ph]").forEach(e=>e.placeholder=t(e.dataset.ph));
 drawFams();drawGrid();drawReel();drawEngines();drawLabo();setLabel()}
$("lang").onclick=()=>{LANG=LANG==="fr"?"en":"fr";LS.set("pf_lang",LANG);i18n()};
let qT=0;$("q").addEventListener("input",e=>{clearTimeout(qT);qT=setTimeout(()=>{S.q=e.target.value.trim();drawFams();drawGrid()},160)});
$("bRand").onclick=randomLook;
(async()=>{i18n();setSource(await startImage(),false);await faunaiStart();window.__pfReady=true})();
</script>
</body>
