<style>
:root{--bg:#07060a;--panel:#0f0d12;--panel2:#17141b;--fg:#efe6cf;--muted:#9a9078;--line:#2c2720;--accent:#c9a84c;--lime:#b9d84a;--ok:#7fdc8a;--err:#e5786c;
 --mono:"DM Mono",ui-monospace,Menlo,Consolas,monospace;--display:"Bebas Neue",Impact,"Arial Narrow",sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);margin:0;height:100%}
body{color:var(--fg);font:14px/1.45 var(--mono);padding:0 max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px))}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.app{max-width:1280px;margin:0 auto;padding-block:max(10px,env(safe-area-inset-top,0px)) 40px;display:grid;gap:12px;grid-template-columns:1fr;grid-template-areas:"head" "stage" "ask" "looks" "adj" "reel"}
@media (min-width:980px){.app{grid-template-columns:minmax(0,1fr) 420px;grid-template-areas:"head head" "stage looks" "ask looks" "adj looks" "reel looks";align-items:start}}
header{grid-area:head;display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{margin:0;font:400 clamp(30px,6vw,46px)/1 var(--display);letter-spacing:.08em;color:var(--fg)}
h1 b{font-weight:400;color:var(--lime)} h1 i{font-style:normal;color:var(--accent)}
.hd{display:flex;gap:6px}
.ghost{font:600 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line);background:transparent;padding:8px 11px;cursor:pointer}
.ghost:hover{border-color:var(--fg)}
/* scène */
.stage{grid-area:stage;position:relative;background:#000;border:1px solid var(--line);display:grid;place-items:center;min-height:240px;max-height:72vh;overflow:hidden;touch-action:none;user-select:none}
.stage canvas,.stage video{display:block;max-width:100%;max-height:72vh;width:auto;height:auto}
.stage video{position:absolute;inset:0;margin:auto;background:#000}
.stage .busy{position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--line);overflow:hidden}
.stage .busy i{position:absolute;inset:0 auto 0 0;width:30%;background:var(--accent)}
@media (prefers-reduced-motion:no-preference){.stage .busy i{animation:sl 1s ease-in-out infinite}}
@keyframes sl{from{left:-30%}to{left:100%}}
.stage .tag{position:absolute;left:8px;top:8px;font:600 11px var(--mono);letter-spacing:.06em;background:rgba(7,6,10,.7);padding:3px 7px;text-transform:uppercase}
.stage .vx{position:absolute;right:8px;top:8px}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.btn{flex:1 1 0;min-width:0;font:400 22px/1 var(--display);letter-spacing:.08em;border:1px solid var(--line);background:var(--panel);padding:12px 8px;cursor:pointer;text-align:center}
.btn:hover{border-color:var(--fg)}
.btn.main{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn.vid{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.btn[disabled]{opacity:.35;cursor:default}
.ask{grid-area:ask;display:flex;flex-direction:column;gap:8px}
.ask .row{display:flex;gap:6px}
#prompt{flex:1 1 auto;min-width:0;font:500 15px var(--mono);color:var(--fg);background:var(--panel);border:1px solid var(--line);padding:10px 12px;border-radius:0}
#prompt::placeholder{color:var(--muted)}
.ask .row .btn{flex:0 0 auto;padding:10px 16px}
.status{min-height:20px;font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.status.err{color:var(--err)} .status.ok{color:var(--ok)}
#stopAi{padding:3px 8px}
/* rendus */
.looks{grid-area:looks;display:flex;flex-direction:column;gap:8px;min-width:0}
.fams{display:flex;gap:4px;overflow-x:auto;scrollbar-width:thin;padding-bottom:2px}
.fams button{flex:0 0 auto;font:600 11px var(--mono);letter-spacing:.05em;text-transform:uppercase;border:1px solid var(--line);background:transparent;padding:7px 9px;cursor:pointer;white-space:nowrap;color:var(--muted)}
.fams button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.strip{display:grid;grid-auto-flow:column;grid-auto-columns:96px;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
@media (min-width:980px){.strip{grid-auto-flow:row;grid-template-columns:repeat(4,1fr);grid-auto-columns:auto;max-height:calc(100vh - 150px);overflow-y:auto;overflow-x:hidden}}
.lk{display:flex;flex-direction:column;gap:3px;border:1px solid var(--line);background:var(--panel);padding:3px;cursor:pointer;text-align:left;min-width:0}
.lk:hover{border-color:var(--muted)}
.lk[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.lk img,.lk .ph{width:100%;aspect-ratio:1;object-fit:cover;background:#16131a;display:block}
.lk span{font-size:10.5px;line-height:1.2;color:var(--fg);min-height:2.4em;overflow:hidden}
/* réglages */
.adj{grid-area:adj;border:1px solid var(--line);background:var(--panel)}
.adj summary{cursor:pointer;padding:9px 12px;font:600 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sl{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px 16px;padding:4px 12px 12px}
.sl label{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--muted)}
.sl input{width:100%;accent-color:var(--accent)}
/* pellicule */
.reel{grid-area:reel;display:flex;flex-direction:column;gap:6px}
.reel h2{margin:0;font:400 20px/1 var(--display);letter-spacing:.08em;color:var(--muted)}
.film{display:grid;grid-auto-flow:column;grid-auto-columns:88px;gap:6px;overflow-x:auto;padding-bottom:4px}
.film .it{position:relative;border:1px solid var(--line);background:#000;cursor:pointer;padding:0;aspect-ratio:1;overflow:hidden}
.film .it img,.film .it video{width:100%;height:100%;object-fit:cover;display:block}
.film .it b{position:absolute;left:3px;bottom:3px;font:600 9px var(--mono);background:rgba(0,0,0,.7);padding:1px 4px;text-transform:uppercase}
.film .it .x{position:absolute;right:2px;top:2px;font-size:11px;background:rgba(0,0,0,.7);border:0;padding:1px 5px;cursor:pointer}
/* clés */
dialog{background:var(--panel);color:var(--fg);border:1px solid var(--line);padding:16px;max-width:560px;width:calc(100% - 24px)}
dialog::backdrop{background:rgba(0,0,0,.7)}
dialog h2{margin:0 0 8px;font:400 24px/1 var(--display);letter-spacing:.08em}
dialog p{font-size:12px;color:var(--muted);margin:6px 0}
dialog label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);margin:8px 0}
dialog input{font:500 14px var(--mono);padding:8px 10px;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:0}
dialog a{color:var(--accent)}
.dlgrow{display:flex;gap:6px;justify-content:space-between;align-items:center;margin-top:10px;flex-wrap:wrap}
footer{grid-column:1/-1;font-size:11px;color:var(--muted)}
footer a{color:var(--muted)}
</style>
</head>

<div class="app">
 <header>
  <h1>Photo<b>fauna</b> <i>+ FaunAI</i></h1>
  <div class="hd"><button class="ghost" id="lang" type="button">EN</button><button class="ghost" id="keysBtn" type="button" data-i="keys"></button></div>

 <section class="stage" id="stage" aria-label="Photo">

  <span class="tag" id="tag"></span>

  <div class="busy" id="busy" hidden><i></i></div>

 <section class="ask">
  <div class="tools">
   <button class="btn" id="bOpen" type="button" data-i="open"></button>
   <button class="btn" id="bShoot" type="button" data-i="shoot"></button>
   <button class="btn" id="bUndo" type="button" data-i="undo"></button>
   <button class="btn main" id="bSave" type="button" data-i="save"></button>
  </div>
  <div class="row">
   <input id="prompt" type="text" data-ph="ph" autocomplete="off" aria-label="Prompt">
   <button class="btn main" id="goImg" type="button" data-i="img"></button>
   <button class="btn vid" id="goVid" type="button" data-i="vid"></button>
  </div>
  <div class="status" id="status" aria-live="polite"><span id="stText"></span><button class="ghost" id="stopAi" type="button" hidden data-i="stop"></button></div>
 </section>

 <section class="looks" aria-label="Looks">
  <nav class="fams" id="fams"></nav>
  <div class="strip" id="strip"></div>
 </section>

 <details class="adj" id="adj">
  <summary data-i="adjust"></summary>
  <div class="sl">
   <label><span data-i="a_str"></span><input type="range" id="a_str" min="0" max="1" step="0.01" value="1"></label>
   <label><span data-i="a_exp"></span><input type="range" id="a_exp" min="-1" max="1" step="0.01" value="0"></label>
   <label><span data-i="a_con"></span><input type="range" id="a_con" min="-1" max="1" step="0.01" value="0"></label>
   <label><span data-i="a_tmp"></span><input type="range" id="a_tmp" min="-1" max="1" step="0.01" value="0"></label>
   <label><span data-i="a_grn"></span><input type="range" id="a_grn" min="0" max="1" step="0.01" value="0"></label>
  </div>
 </details>

 <section class="reel" id="reel" hidden>
  <h2 data-i="reel"></h2>
  <div class="film" id="film"></div>
 </section>

 <footer><span data-i="foot"></span> · <a href="https://mauktenieb.github.io/insertkoin/">Insert Koin</a> · <a href="https://github.com/MaukTenieb">github.com/MaukTenieb</a> · © Mauk Tenieb &amp; Korhogo</footer>
</div>

<input type="file" id="fOpen" accept="image/*" hidden>
<input type="file" id="fShoot" accept="image/*" capture="environment" hidden>

<dialog id="dlgKeys">
 <h2 data-i="keys"></h2>
 <p data-i="keys_txt"></p>
 <label><span>Hugging Face · <a href="https://huggingface.co/settings/tokens" target="_blank" rel="noopener">https://huggingface.co/settings/tokens</a></span><input type="password" id="k_hf" autocomplete="off" placeholder="hf_…"></label>
 <label><span>Pollinations · <a href="https://enter.pollinations.ai/" target="_blank" rel="noopener">https://enter.pollinations.ai/</a></span><input type="password" id="k_pol" autocomplete="off" placeholder="sk_…"></label>
 <label><span>AI Horde · <a href="https://aihorde.net/register" target="_blank" rel="noopener">https://aihorde.net/register</a></span><input type="password" id="k_horde" autocomplete="off" placeholder="0000000000"></label>
 <p id="engSum"></p>
 <p id="puterSum"></p>
 <div class="dlgrow"><button class="ghost" id="census" type="button" data-i="census"></button><span class="status" id="censusSt"></span><button class="ghost" id="keysClose" type="button">OK</button></div>
</dialog>

<script type="text/plain" id="engine-src">/* ==== MOTEUR : noyau ====

var sstep=function(a,b,x){var t=clamp((x-a)/(b-a||1e-9),0,1);return t*t*(3-2*t);};

function cloneI(a){return {w:a.w,h:a.h,d:new Uint8ClampedArray(a.d)};}
function hex(c){if(Array.isArray(c))return c;c=String(c||'#000').replace('#','');if(c.length===3)c=c[0]+c[0]+c[1]+c[1]+c[2]+c[2];return [parseInt(c.slice(0,2),16)||0,parseInt(c.slice(2,4),16)||0,parseInt(c.slice(4,6),16)||0];}

function U(im){return Math.min(im.w,im.h);}

/* flou boîte séparable sur plan flottant, 3 passes ~ gaussien */
function boxPlane(src,w,h,r){r=Math.max(0,Math.round(r));if(r<1)return new Float32Array(src);var tmp=new Float32Array(w*h),out=new Float32Array(src),k=1/(2*r+1);
 for(var pass=0;pass<3;pass++){
  for(var y=0;y<h;y++){var row=y*w,acc=0;for(var x=-r;x<=r;x++)acc+=out[row+clamp(x,0,w-1)];for(x=0;x<w;x++){tmp[row+x]=acc*k;acc+=out[row+Math.min(x+r+1,w-1)]-out[row+Math.max(x-r,0)];}}
  for(x=0;x<w;x++){acc=0;for(y=-r;y<=r;y++)acc+=tmp[clamp(y,0,h-1)*w+x];for(y=0;y<h;y++){out[y*w+x]=acc*k;acc+=tmp[Math.min(y+r+1,h-1)*w+x]-tmp[Math.max(y-r,0)*w+x];}}

function blurImg(im,r){r=Math.round(r);if(r<1)return cloneI(im);var w=im.w,h=im.h,n=w*h,o=newImg(w,h);for(var c=0;c<3;c++){var p=new Float32Array(n);for(var i=0;i<n;i++)p[i]=im.d[i*4+c];var b=boxPlane(p,w,h,r);for(i=0;i<n;i++)o.d[i*4+c]=b[i];}return o;}

   od[oi]=d[a]*u0+d[b]*u1+d[c]*u2+d[e]*u3;od[oi+1]=d[a+1]*u0+d[b+1]*u1+d[c+1]*u2+d[e+1]*u3;od[oi+2]=d[a+2]*u0+d[b+2]*u1+d[c+2]*u2+d[e+2]*u3;}}return o;}
function resizeNearest(im,W,H){var o=newImg(W,H);for(var y=0;y<H;y++){var sy=Math.min(im.h-1,Math.floor(y*im.h/H));for(var x=0;x<W;x++){var sx=Math.min(im.w-1,Math.floor(x*im.w/W)),i=(y*W+x)*4,j=(sy*im.w+sx)*4;o.d[i]=im.d[j];o.d[i+1]=im.d[j+1];o.d[i+2]=im.d[j+2];}}return o;}

 for(var y=0;y<H;y++){var y0=Math.floor(y*sy),y1=Math.max(y0+1,Math.floor((y+1)*sy));for(var x=0;x<W;x++){var x0=Math.floor(x*sx),x1=Math.max(x0+1,Math.floor((x+1)*sx)),r=0,g=0,b=0,n=0;
  for(var yy=y0;yy<y1;yy++)for(var xx=x0;xx<x1;xx++){var j=(yy*im.w+xx)*4;r+=im.d[j];g+=im.d[j+1];b+=im.d[j+2];n++;}var i=(y*W+x)*4;o.d[i]=r/n;o.d[i+1]=g/n;o.d[i+2]=b/n;}}return o;}
function sub(im,x0,y0,w,h){var o=newImg(w,h);for(var y=0;y<h;y++){var sy=clamp(y+y0,0,im.h-1);for(var x=0;x<w;x++){var sx=clamp(x+x0,0,im.w-1),i=(y*w+x)*4,j=(sy*im.w+sx)*4;o.d[i]=im.d[j];o.d[i+1]=im.d[j+1];o.d[i+2]=im.d[j+2];}}return o;}
function paste(dst,src,x0,y0){for(var y=0;y<src.h;y++){var dy=y+y0;if(dy<0||dy>=dst.h)continue;for(var x=0;x<src.w;x++){var dx=x+x0;if(dx<0||dx>=dst.w)continue;var i=(dy*dst.w+dx)*4,j=(y*src.w+x)*4;dst.d[i]=src.d[j];dst.d[i+1]=src.d[j+1];dst.d[i+2]=src.d[j+2];}}}
/* bruit de valeur et fbm, déterministes */
function vnoise(x,y,s){var xi=Math.floor(x),yi=Math.floor(y),fx=x-xi,fy=y-yi;fx=fx*fx*(3-2*fx);fy=fy*fy*(3-2*fy);

/* plan de bruit calculé à basse définition puis agrandi (rapide) */
function noisePlane(w,h,scale,seed,oct,maxRes){maxRes=Math.max(maxRes||384,Math.round(Math.max(w,h)/3));maxRes=Math.min(maxRes,900);var k=Math.min(1,maxRes/Math.max(w,h)),W=Math.max(2,Math.round(w*k)),H=Math.max(2,Math.round(h*k)),p=new Float32Array(W*H),m=Math.min(w,h)*k;

<script>/* Insert Koin: every saved file is named after the French Republican calendar, then the program, then a counter of the day:
   18-vendemiaire-235_photofauna_001.png
   Years III, VII, XI and XV were sextile (as kept in their day); from XX on, Romme's rule (every 4th year, but not the 100th unless the 400th, nor the 4000th).
   The date is the visitor's own local day. The counter lives in the browser (ik.saves), per program and per day. */
(function(){
  var MONTHS=['vendemiaire','brumaire','frimaire','nivose','pluviose','ventose','germinal','floreal','prairial','messidor','thermidor','fructidor','sansculottides'];
  function sextile(y){if(y<20)return y===3||y===7||y===11||y===15;return y%4===0&&(y%100!==0||y%400===0)&&y%4000!==0;}
  function rep(d){d=d||new Date();var n=Math.round((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())-Date.UTC(1792,8,22))/864e5),y=1;
    if(n<0)return null;for(;;){var L=sextile(y)?366:365;if(n<L)break;n-=L;y++;}return{year:y,month:Math.floor(n/30)+1,day:n%30+1};}
  function repDate(d){var r=rep(d);return r?r.day+'-'+MONTHS[r.month-1]+'-'+r.year:'0';}
  function ikName(prog,ext,d){var date=repDate(d),k=date+'|'+prog,n=1,m={};
    try{m=JSON.parse(localStorage.getItem('ik.saves')||'{}')||{};Object.keys(m).forEach(function(x){if(x.split('|')[0]!==date)delete m[x];});n=(m[k]||0)+1;m[k]=n;localStorage.setItem('ik.saves',JSON.stringify(m));}catch(e){n=1+Math.floor(Math.random()*999);}
    return date+'_'+prog+'_'+String(n).padStart(3,'0')+(ext?'.'+String(ext).replace(/^\./,''):'');}
  window.ikRep=rep;window.ikRepDate=repDate;window.ikName=ikName;
})();
</script>

function scaleTo(img,max){const k=Math.min(1,max/Math.max(img.width,img.height));if(k>=1)return img;const c=document.createElement("canvas");c.width=Math.max(1,Math.round(img.width*k));c.height=Math.max(1,Math.round(img.height*k));

  else{job.image=await canvasBlob(S.lastView||S.prev,1024);out=await chain("i2v",job,1);const blob=out.blob||await fetchBlob(out.url);const it=await keepReel({type:"video",blob,url:blob?null:out.url,prompt,engine:out.engine});showVideo(it)}
  aiSt.end(`${t("done")} ${Math.round((Date.now()-t0)/1000)} s · ${out.engine||""}`,"ok")}
 catch(e){if(STOP.signal.aborted)aiSt.end(t("stopped"));else aiSt.end(NETFAIL&&NETFAIL===TRIES.length?t("net"):t(want==="image"?"fail_img":"fail_vid"),"err")}
 finally{STOP=null;$("goImg").disabled=$("goVid").disabled=false;drawEngines()}}
$("goImg").onclick=()=>aiGenerate("image");$("goVid").onclick=()=>aiGenerate("video");$("stopAi").onclick=()=>STOP&&STOP.abort();
$("prompt").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();aiGenerate("image")}});

/* ---------- pellicule : images et vidéos fabriquées, gardées dans ce navigateur ---------- */
const DB=(()=>{let p=null;const open=()=>p||(p=new Promise((res,rej)=>{try{const r=indexedDB.open("photofauna-faunai",1);r.onupgradeneeded=()=>{r.result.createObjectStore("kv");r.result.createObjectStore("reel",{keyPath:"id"})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}}));
 const tx=async(s,m,f)=>{const db=await open();return new Promise((res,rej)=>{const x=db.transaction(s,m),q=f(x.objectStore(s));x.oncomplete=()=>res(q&&q.result);x.onerror=()=>rej(x.error)})};
 const safe=f=>async(...a)=>{try{return await f(...a)}catch{return undefined}};
 return{get:safe(k=>tx("kv","readonly",s=>s.get(k))),set:safe((k,v)=>tx("kv","readwrite",s=>s.put(v,k))),put:safe(o=>tx("reel","readwrite",s=>s.put(o))),all:safe(()=>tx("reel","readonly",s=>s.getAll())),del:safe(id=>tx("reel","readwrite",s=>s.delete(id)))}})();
let REEL=[];const RURL=new Map();let CUR_VID=null;
const srcOf=it=>{if(!it.blob)return it.url;if(!RURL.has(it.id))RURL.set(it.id,URL.createObjectURL(it.blob));return RURL.get(it.id)};
async function keepReel(o){const it={id:Date.now()+"-"+Math.random().toString(36).slice(2,7),ts:Date.now(),...o};await DB.put(it);REEL.unshift(it);drawReel();return it}
function drawReel(){const box=$("film");box.textContent="";$("reel").hidden=!REEL.length;
 for(const it of REEL){const b=document.createElement("div");b.className="it";b.title=it.prompt||"";const s=srcOf(it);
  b.innerHTML=(it.type==="video"?`<video src="${esc(s)}" muted playsinline preload="metadata"></video>`:`<img alt="" src="${esc(s)}">`)+`<b>${t(it.type==="video"?"video":"photo")}</b><button class="x" type="button" aria-label="✕">✕</button>`;
  b.onclick=async e=>{if(e.target.classList.contains("x")){await DB.del(it.id);REEL=REEL.filter(x=>x!==it);if(CUR_VID===it)closeVideo();drawReel();return}
   if(it.type==="video")showVideo(it);else if(it.blob){pushHist();setSource(await readFile(new File([it.blob],"p.jpg",{type:it.blob.type})),true);closeVideo()}};
  box.appendChild(b)}}
function showVideo(it){CUR_VID=it;const v=$("player");v.src=srcOf(it);v.hidden=false;$("closeVid").hidden=false;$("tag").textContent=t("video");v.play().catch(()=>{})}
function closeVideo(){const v=$("player");if(v.hidden)return;v.pause();v.hidden=true;$("closeVid").hidden=true;CUR_VID=null;const L=LOOKS.find(l=>l.id===S.look);$("tag").textContent=L?lname(L):t("orig")}
$("closeVid").onclick=closeVideo;

/* ---------- clés, recensement des moteurs ---------- */
$("keysBtn").onclick=()=>{drawEngines();puterCredits();$("dlgKeys").showModal()};$("keysClose").onclick=()=>$("dlgKeys").close();
for(const k of ["hf","pol","horde"]){const el=$("k_"+k);el.value=LS.get("fa_k_"+k,"");el.onchange=()=>{LS.set("fa_k_"+k,el.value.trim());if(k==="hf"){ZERO_UNTIL=0;LS.set("fa_zero",0)}drawEngines()}}
function drawEngines(){const L=engines(),v=L.filter(e=>e.modes.some(VIDEO)).length;$("engSum").textContent=t("eng_sum",{n:L.length,v,d:CENSUS?.date?new Date(CENSUS.date).toLocaleDateString(LANG):"16/10/2026"})}
async function puterCredits(){if(!window.puter||!window.puter.auth.isSignedIn()){$("puterSum").textContent=t("puter_none");return}
 try{const u=await window.puter.auth.getMonthlyUsage(),c=Math.max(0,Math.floor(u.allowanceInfo?.remaining||0));$("puterSum").textContent=t("puter_left",{c,v:Math.floor(c/320)})}catch{$("puterSum").textContent=""}}
const HF_TERMS=["flux","flux schnell","sdxl","sdxl lightning","stable diffusion","text to image","image generation","z-image","qwen image","hidream","sana","ltx video","wan2","wan 2.2","wan 2.1","text to video","image to video","video generation","cogvideox","hunyuan video","framepack","stable video diffusion"];
let CENSUS_RUN=false;
async function census(){if(CENSUS_RUN)return;CENSUS_RUN=true;$("census").disabled=true;const say=x=>$("censusSt").textContent=x;
 try{const sp={};let i=0;
  for(const term of HF_TERMS){say(t("census_run",{x:`${++i}/${HF_TERMS.length}`}));
   try{const d=await jget(`${HF}/api/spaces?search=${enc(term)}&sort=likes&direction=-1&limit=60&expand[]=runtime&expand[]=likes&expand[]=sdk&expand[]=cardData`);
    for(const x of d){const rt=x.runtime||{};if(x.sdk!=="gradio"||rt.stage!=="RUNNING"||sp[x.id])continue;const doms=(rt.domains||[]).filter(d=>d.stage==="READY").map(d=>d.domain),own=slugHost(x.id);
     sp[x.id]={id:x.id,likes:x.likes||0,title:x.cardData?.title||x.id.split("/")[1],hw:rt.hardware?.current||"",host:doms.includes(own)?own:(doms[doms.length-1]||own)}}}
   catch(e){if(/429/.test(e.message))await sleep(30000)}await sleep(500)}
  const ids=Object.keys(sp);let k=0;
  const worker=async()=>{while(k<ids.length){const s=sp[ids[k++]];say(t("census_run",{x:`API ${k}/${ids.length}`}));const inf=await hfInfo(s.host).catch(()=>null);if(!inf)continue;const c=classify(inf.info);if(!c.length)continue;s.eps={};for(const x of c)if(!s.eps[x.mode])s.eps[x.mode]=x.ep}};
  await Promise.all([worker(),worker(),worker(),worker()]);
  const spaces=Object.values(sp).filter(s=>s.eps).map(({id,likes,title,hw,eps})=>({id,likes,title,hw,eps}));
  let pol=CENSUS?.pol||[];try{pol=(await jget("https://gen.pollinations.ai/image/models")).map(m=>({name:m.name,title:m.title,category:m.category}))}catch{}
  if(spaces.length){CENSUS={date:Date.now(),spaces,pol};await DB.set("census",CENSUS)}say(t("census_done",{n:engines().length}));drawEngines()}
 finally{CENSUS_RUN=false;$("census").disabled=false}}
$("census").onclick=census;
async function faunaiStart(){CENSUS=(await DB.get("census"))||null;REEL=((await DB.all())||[]).sort((a,b)=>b.ts-a.ts);drawReel();drawEngines();
 if(!CENSUS||Date.now()-CENSUS.date>3*864e5)setTimeout(()=>census().catch(()=>{}),4000)}


/* ---------- langue, démarrage ---------- */
function i18n(){document.documentElement.lang=LANG;$("lang").textContent=LANG==="fr"?"EN":"FR";
 document.querySelectorAll("[data-i]").forEach(e=>e.textContent=t(e.dataset.i));document.querySelectorAll("[data-ph]").forEach(e=>e.placeholder=t(e.dataset.ph));
 drawFams();drawStrip();drawReel();drawEngines();const L=LOOKS.find(l=>l.id===S.look);$("tag").textContent=L?lname(L):t("orig")}
$("lang").onclick=()=>{LANG=LANG==="fr"?"en":"fr";LS.set("pf_lang",LANG);i18n()};
(async()=>{i18n();setSource(await startImage(),false);await faunaiStart()})();
</script>
