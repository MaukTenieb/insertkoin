<div id="vhs" class="vhs is-fresh" data-vhs-root data-atelier="page" tabindex="-1" role="region" aria-label="VHS">
  <!-- The screen: the shared screen of Insert Koin (ik-ecran.js), same frame, size and place as in
       every program; profile "vhs" (glass, tape shader, wear over YouTube). -->
  <div class="vhs-screen" data-vhs-screen>
    <div class="vhs-boot" data-vhs-boot aria-hidden="true">
      <div class="vhs-boot-snow"></div>
      <div class="vhs-boot-flap"></div>
      <svg class="vhs-boot-tape" viewBox="0 0 120 78" xmlns="http://www.w3.org/2000/svg">
        <rect x="2" y="6" width="116" height="66" rx="5" fill="#141414" stroke="#2c2c2c" stroke-width="2"/>
        <rect x="14" y="12" width="92" height="30" rx="3" fill="#1e1e1e" stroke="#333" stroke-width="1"/>
        <rect x="18" y="16" width="84" height="22" rx="2" fill="#0c0c0c"/>
        <circle cx="34" cy="52" r="11" fill="#0a0a0a" stroke="#3a3a3a" stroke-width="2"/>
        <circle cx="86" cy="52" r="11" fill="#0a0a0a" stroke="#3a3a3a" stroke-width="2"/>
        <circle cx="34" cy="52" r="4.5" fill="#181818" stroke="#555" stroke-width="1.5"/>
        <circle cx="86" cy="52" r="4.5" fill="#181818" stroke="#555" stroke-width="1.5"/>
        <rect x="52" y="49" width="16" height="6" rx="1.5" fill="#0f0f0f" stroke="#3a3a3a"/>
        <rect x="8" y="8" width="104" height="2.5" rx="1" fill="#b9d84a" opacity="0.55"/>
      </svg>
    </div>
    <div class="vhs-scan" data-vhs-scan hidden aria-hidden="true"></div>
    <div class="vhs-youtube" data-vhs-youtube></div>
    <video class="vhs-video" data-vhs-video playsinline preload="metadata"></video>
    <canvas class="vhs-canvas" data-vhs-canvas aria-hidden="true"></canvas>
  </div>

  <!-- The controls slot: the deck and the catalogue. -->
  <div class="vhs-shell">

    <!-- 16 nov. 2026 (Mauk Tenieb, images du magnétoscope) : la façade est la photo d'un magnétoscope de 1982
         (kave/a/vhs/magnetoscope.webp) ; ses touches, ses molettes et sa prise casque deviennent les commandes,
         l'afficheur vert montre le compteur de la bande, la trappe montre l'étiquette de la cassette.
         La façade garde son échelle (touches de 44 px au moins) et défile de côté quand l'écran est étroit. -->
    <div class="vhs-deck" data-vhs-face>
      <div class="vhs-face">
        <span class="vhs-face-snap" style="--c:413" aria-hidden="true"></span>
        <span class="vhs-face-snap vhs-face-home" style="--c:941" aria-hidden="true"></span>
        <span class="vhs-face-snap" style="--c:1300" aria-hidden="true"></span>
        <div class="vhs-slot vhs-fz" style="--x0:172;--y0:152;--x1:655;--y1:350">
          <div class="vhs-flap" aria-hidden="true"></div>
          <div class="vhs-label" data-vhs-osd-track aria-live="polite">&mdash;</div>
          <button type="button" class="vhs-trap" data-vhs-action="shelf" data-vhs-i18n-aria="CASSETTES" aria-label="CASSETTES"></button>
        </div>
        <div class="vhs-vfd vhs-fz" role="status" style="--x0:872;--y0:156;--x1:1086;--y1:236">
          <span class="vhs-vfd-state" data-vhs-osd-state>Stop</span>
          <span class="vhs-vfd-counter" data-vhs-osd-counter>00:00:00</span>
          <span class="vhs-vfd-status" data-vhs-status hidden>Stop</span>
          <svg class="vhs-seg" data-vhs-seg viewBox="0 0 214 80" aria-hidden="true"></svg>
          <div class="vhs-transport" data-vhs-transport>
            <input type="range" class="vhs-seek" data-vhs-seek min="0" max="1000" step="1" value="0" data-vhs-i18n-aria="Position" aria-label="Position">
          </div>
        </div>
        <div class="vhs-keys" data-vhs-controls>
          <button type="button" class="vhs-key vhs-fz" data-vhs-action="power" style="--x0:672;--y0:248;--x1:740;--y1:354;--c0:678;--c1:734" data-vhs-i18n-aria="Power" aria-label="Power"><i class="vhs-cap" aria-hidden="true"></i></button>
          <button type="button" class="vhs-key vhs-key-eject vhs-fz" data-vhs-action="eject" style="--x0:740;--y0:248;--x1:812;--y1:354;--c0:746;--c1:802" data-vhs-i18n-aria="Eject" aria-label="Eject"><i class="vhs-cap" aria-hidden="true"></i></button>
          <button type="button" class="vhs-key vhs-fz" data-vhs-action="prev" style="--x0:815;--y0:248;--x1:885;--y1:354;--c0:822;--c1:881" data-vhs-i18n-aria="Rewind 5 seconds" aria-label="Rewind 5 seconds"><i class="vhs-cap" aria-hidden="true"></i></button>
          <button type="button" class="vhs-key vhs-key-play vhs-fz" data-vhs-action="play" style="--x0:885;--y0:248;--x1:949;--y1:354;--c0:889;--c1:946" data-vhs-i18n-aria="Play / pause" aria-label="Play / pause"><i class="vhs-cap" aria-hidden="true"></i><span class="vhs-sr" data-vhs-play-label>&#x25B6;</span></button>
          <button type="button" class="vhs-key vhs-fz" data-vhs-action="next" style="--x0:949;--y0:248;--x1:1015;--y1:354;--c0:953;--c1:1011" data-vhs-i18n-aria="Forward 5 seconds" aria-label="Forward 5 seconds"><i class="vhs-cap" aria-hidden="true"></i></button>
          <button type="button" class="vhs-key vhs-fz" data-vhs-action="stop" style="--x0:1015;--y0:248;--x1:1080;--y1:354;--c0:1019;--c1:1076" data-vhs-i18n-aria="Stop" aria-label="Stop"><i class="vhs-cap" aria-hidden="true"></i></button>
          <button type="button" class="vhs-key vhs-fz" data-vhs-action="pause" style="--x0:1080;--y0:248;--x1:1145;--y1:354;--c0:1084;--c1:1141" data-vhs-i18n-aria="Pause" aria-label="Pause"><i class="vhs-cap" aria-hidden="true"></i></button>
          <button type="button" class="vhs-key vhs-key-rec vhs-fz" data-vhs-action="rec" style="--x0:1145;--y0:248;--x1:1212;--y1:354;--c0:1149;--c1:1205" data-vhs-i18n-aria="REC" aria-label="REC"><i class="vhs-cap" aria-hidden="true"></i></button>
          <button type="button" class="vhs-key vhs-key-small vhs-knob vhs-fz" data-vhs-action="random" style="--x0:1244;--y0:146;--x1:1326;--y1:258" data-vhs-i18n-aria="Random" aria-label="Random"><i class="vhs-cap" aria-hidden="true"></i></button>
          <button type="button" class="vhs-key vhs-key-small vhs-knob vhs-fz" data-vhs-action="fine" style="--x0:1377;--y0:146;--x1:1459;--y1:258" data-vhs-i18n-aria="Next track" aria-label="Next track"><i class="vhs-cap" aria-hidden="true"></i></button>
          <button type="button" class="vhs-key vhs-key-small vhs-key-heart vhs-fz" data-vhs-action="heart" style="--x0:1108;--y0:166;--x1:1184;--y1:242" data-vhs-i18n-aria="Keep in Korhogo Kuration" aria-label="Keep in Korhogo Kuration" aria-pressed="false">&#x2661;</button>
          <button type="button" class="vhs-key vhs-jack vhs-fz" data-vhs-action="mute" style="--x0:1380;--y0:286;--x1:1448;--y1:354" data-vhs-i18n-aria="Mute / unmute" aria-label="Mute / unmute" aria-pressed="false"><i class="vhs-plug" aria-hidden="true"></i></button>
        </div>
      </div>
    </div>

    <div class="vhs-source-tabs" role="tablist" data-vhs-i18n-aria="Source" aria-label="Source">
      <button type="button" class="vhs-tab is-active" data-vhs-source="youtube" role="tab" id="vhs-tab-catalogue" aria-controls="vhs-panel-catalogue" aria-selected="true" data-vhs-i18n="CATALOGUE">CATALOGUE</button>
      <button type="button" class="vhs-tab" data-vhs-source="local" role="tab" id="vhs-tab-local" aria-controls="vhs-panel-local" aria-selected="false" data-vhs-i18n="FILES" hidden>FILES</button>
    </div>

    <div class="vhs-catalogue" data-vhs-catalogue id="vhs-panel-catalogue" role="tabpanel" aria-labelledby="vhs-tab-catalogue">

      <!-- Cassette shelf: one tape per scraped channel (CHANNEL.SCRAPE). -->
      <div class="vhs-shelf" data-vhs-shelf>
        <div class="vhs-shelf-head">
          <span class="vhs-shelf-title" data-vhs-i18n="CASSETTES">CASSETTES</span>
          <span class="vhs-shelf-actions">
            <button type="button" class="vhs-ttx-btn" data-vhs-ttx-btn data-vhs-i18n="TEXT">TEXT</button>
            <!-- 16 nov. 2026 (Mauk Tenieb, images du magnétoscope) : « toutes les cassettes » en picto, une pile de cassettes -->
            <button type="button" class="vhs-tape vhs-tape-all" data-vhs-tape-all data-vhs-i18n-aria="All cassettes" aria-label="All cassettes">
              <svg class="vhs-pic" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="14" width="18" height="6" rx="1"/><rect x="4" y="8" width="16" height="6" rx="1"/><rect x="5" y="2.5" width="14" height="5.5" rx="1"/><path d="M8 17h8M9 11h6"/></svg>
              <span class="vhs-tape-name vhs-sr" data-vhs-i18n="all">all</span>
            </button>
          </span>
        </div>
        <div class="vhs-shelf-row" data-vhs-shelf-row></div>
        <div class="vhs-shelf-empty" data-vhs-shelf-empty data-vhs-i18n="No cassette yet. Record a channel.">No cassette yet. Record a channel.</div>

        <!-- Tape tools: exports + eject for the selected cassette (History). -->
        <div class="vhs-tapetools" data-vhs-tapetools hidden>
          <span class="vhs-tapetools-name" data-vhs-tapetools-name></span>
          <span class="vhs-tapetools-actions">
            <a class="vhs-tapetools-link" data-vhs-tapetools-csv href="#" download data-vhs-i18n="CSV">CSV</a>
            <a class="vhs-tapetools-link" data-vhs-tapetools-json href="#" download data-vhs-i18n="JSON">JSON</a>
            <a class="vhs-tapetools-link" data-vhs-tapetools-xlsx href="#" download data-vhs-i18n="XLSX">XLSX</a>
            <a class="vhs-tapetools-link" data-vhs-tapetools-txt href="#" download data-vhs-i18n="TXT">TXT</a>
            <a class="vhs-tapetools-link" data-vhs-tapetools-md href="#" download data-vhs-i18n="MD">MD</a>
            <a class="vhs-tapetools-link" data-vhs-tapetools-yt href="#" target="_blank" rel="noopener" hidden>YOUTUBE</a>
            <button type="button" class="vhs-tapetools-eject" data-vhs-tapetools-eject data-vhs-i18n="ERASE">ERASE</button>
          </span>
        </div>
      </div>

      <!-- Finder: live filter over the deck's tracklist (Explorer). -->
      <div class="vhs-find" data-vhs-find>
        <span class="vhs-find-glass" aria-hidden="true">&#x2315;</span><input type="search" class="vhs-find-input" data-vhs-find-input placeholder="&#x2315;"
               data-vhs-i18n-aria="Find a track on the deck"
               aria-label="Find a track on the deck"
               spellcheck="false" autocomplete="off">
        <span class="vhs-find-count" data-vhs-find-count></span>
        <!-- the order keys of the deck (no native select): one key per order, the pressed one lit -->
        <div class="vhs-find-sort" data-vhs-find-sort role="group"
             data-vhs-i18n-aria="Sort the tracklist" aria-label="Sort the tracklist">
          <button type="button" class="vhs-sort-key vhs-sort-pic" data-vhs-sort="native" aria-pressed="true" data-vhs-i18n-aria="Tape order" aria-label="Tape order" title="Tape order"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="19" height="12" rx="1.5"/><circle cx="8" cy="12" r="2"/><circle cx="16" cy="12" r="2"/><path d="M10 12h4"/></svg></button>
          <button type="button" class="vhs-sort-key vhs-sort-pic" data-vhs-sort="date_desc" aria-pressed="false" data-vhs-i18n-aria="Newest first" aria-label="Newest first" title="Newest first"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="13" height="14" rx="1.5"/><path d="M3 9h13M7 3v4M12 3v4"/><path d="M20 9v10M17.5 16.5 20 19l2.5-2.5"/></svg></button>
          <button type="button" class="vhs-sort-key vhs-sort-pic" data-vhs-sort="date_asc" aria-pressed="false" data-vhs-i18n-aria="Oldest first" aria-label="Oldest first" title="Oldest first"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="13" height="14" rx="1.5"/><path d="M3 9h13M7 3v4M12 3v4"/><path d="M20 19V9M17.5 11.5 20 9l2.5 2.5"/></svg></button>
          <button type="button" class="vhs-sort-key vhs-sort-pic" data-vhs-sort="title_az" aria-pressed="false" data-vhs-i18n-aria="Title A – Z" aria-label="Title A – Z" title="Title A – Z"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 15l3-9 3 9M4 12.5h4M12 6h6l-6 9h6"/><path d="M21 6v12M19 16l2 2 2-2"/></svg></button>
          <button type="button" class="vhs-sort-key vhs-sort-pic" data-vhs-sort="title_za" aria-pressed="false" data-vhs-i18n-aria="Title Z – A" aria-label="Title Z – A" title="Title Z – A"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h6l-6 9h6M12 15l3-9 3 9M13 12.5h4"/><path d="M21 6v12M19 16l2 2 2-2"/></svg></button>
          <button type="button" class="vhs-sort-key vhs-sort-pic" data-vhs-sort="random" aria-pressed="false" data-vhs-i18n-aria="Shuffle" aria-label="Shuffle" title="Shuffle"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h3c4 0 6 10 10 10h4M3 17h3c1.6 0 2.8-1.6 4-3.6M13.6 9.6C14.8 8 15.7 7 17 7h3M18 4.5 20.5 7 18 9.5M18 14.5 20.5 17 18 19.5"/></svg></button>
        </div>
      </div>

      <!-- Recorder bay: paste a channel URL, REC records it onto a cassette. -->
      <div class="vhs-rec" data-vhs-rec>
        <input type="url" class="vhs-rec-input" data-vhs-rec-input
               placeholder="https://www.youtube.com/@channel"
               data-vhs-i18n-aria="YouTube channel or playlist URL"
               aria-label="YouTube channel or playlist URL"
               spellcheck="false" autocomplete="off">
        <button type="button" class="vhs-rec-btn" data-vhs-rec-btn>
          <span class="vhs-rec-dot" aria-hidden="true">&#x25CF;</span>
          <span class="vhs-sr" data-vhs-i18n="REC">REC</span>
        </button>
        <button type="button" class="vhs-rec-cancel" data-vhs-rec-cancel hidden
                data-vhs-i18n="CANCEL">CANCEL</button>
        <div class="vhs-rec-progress" data-vhs-rec-progress></div>
      </div>

      <ol class="vhs-tracklist" data-vhs-tracklist data-vhs-i18n-aria="CATALOGUE" aria-label="CATALOGUE"></ol>

      <!-- Teletext: the Critiques pages, decoded through the deck (data line 21). -->
      <div class="vhs-ttx" data-vhs-ttx hidden>
        <div class="vhs-ttx-head">
          <span class="vhs-ttx-brand">P100</span>
          <span class="vhs-ttx-title" data-vhs-i18n="KRITIK">KRITIK</span>
          <button type="button" class="vhs-ttx-close" data-vhs-ttx-close aria-label="Close">&#x2715;</button>
        </div>
        <div class="vhs-ttx-sources" data-vhs-ttx-sources></div>
        <div class="vhs-ttx-items" data-vhs-ttx-items>
          <div class="vhs-ttx-hint" data-vhs-i18n="Pick a page.">Pick a page.</div>
        </div>
      </div>
    </div>

    <div class="vhs-local" data-vhs-local id="vhs-panel-local" role="tabpanel" aria-labelledby="vhs-tab-local" hidden>
      <div class="vhs-local-empty" data-vhs-local-empty data-vhs-i18n="No local VHS files have been supplied.">No local VHS files have been supplied.</div>
      <ol class="vhs-local-list" data-vhs-local-list data-vhs-i18n-aria="FILES" aria-label="FILES"></ol>
    </div>

    <div class="vhs-message" data-vhs-message role="status"></div>
  </div>
</div>
