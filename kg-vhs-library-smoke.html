<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>KGVHS Library — smoke test</title>
<style>
  body { font-family: ui-monospace, Consolas, monospace; background: #111; color: #ddd; padding: 24px; }
  h1 { font-size: 18px; }
  .pass { color: #7dd87d; }
  .fail { color: #ff5f5f; }
  .warn { color: #e5c15b; }
  pre { background: #181818; border: 1px solid #333; padding: 12px; font-size: 12px; white-space: pre-wrap; }
  table { border-collapse: collapse; font-size: 13px; margin-top: 12px; }
  td, th { border: 1px solid #333; padding: 4px 10px; text-align: left; }
  th { background: #181818; }
</style>
</head>
<body>
<h1>KGVHS Library — smoke test (adaptateur CHANNEL.SCRAPE → JUKE_TRACKS)</h1>
<p id="api-note" class="warn">Backend attendu sur http://127.0.0.1:8001 — démarre-le si nécessaire.</p>
<pre id="status">chargement…</pre>
<table id="tapes"></table>
<ol id="tracks"></ol>

<script src="kg-vhs-library.js"></script>
<script>
(function () {
  var statusEl = document.getElementById("status");
  var tapesEl = document.getElementById("tapes");
  var tracksEl = document.getElementById("tracks");

  function render() {
    var st = window.KGVHSLibrary.status();
    var lines = [
      "status     : " + st.status,
      "tracks     : " + st.tracks,
      "tapes      : " + st.tapes,
      "fromBackend: " + st.fromBackend,
      "fromCache  : " + st.fromCache,
      "loadedAt   : " + (st.loadedAt ? new Date(st.loadedAt).toLocaleTimeString() : "—"),
      "error      : " + (st.error || "—"),
      "",
      "KG_VHS_TRACKS type: " + (Array.isArray(window.KG_VHS_TRACKS) ? "Array ✓" : typeof window.KG_VHS_TRACKS),
      "JUKE_TRACKS (jukebox, doit rester intact) : " + (Array.isArray(window.JUKE_TRACKS) ? window.JUKE_TRACKS.length + " pistes" : "non défini ✓")
    ];
    statusEl.textContent = lines.join("\n");

    var tapes = window.KGVHSLibrary.tapes();
    var html = "<tr><th></th><th>cassette</th><th>chaîne</th><th>pistes</th></tr>";
    for (var i = 0; i < tapes.length; i++) {
      html += '<tr><td><button data-tape="' + tapes[i].channel + '">▶</button></td><td>' + (i + 1) + "</td><td>" + tapes[i].channel + "</td><td>" + tapes[i].count + "</td></tr>";
    }
    tapesEl.innerHTML = tapes.length ? html : "";

    tracksEl.innerHTML = "";
    var tracks = window.KG_VHS_TRACKS || [];
    var max = Math.min(tracks.length, 12);
    for (var j = 0; j < max; j++) {
      var li = document.createElement("li");
      li.textContent = tracks[j].title + "  [" + tracks[j].id + "]";
      tracksEl.appendChild(li);
    }
  }

  // One cassette on the deck
  tapesEl.addEventListener("click", function (e) {
    var name = e.target && e.target.getAttribute && e.target.getAttribute("data-tape");
    if (name) { window.KGVHSLibrary.selectTape(name); render(); }
  });

  // Badge pass/fail
  var note = document.getElementById("api-note");
  window.KGVHSLibrary.ready().then(function () {
    var st = window.KGVHSLibrary.status();
    if (st.status === "ready" && st.fromBackend) {
      note.textContent = "✓ Adaptateur chargé depuis le backend CHANNEL.SCRAPE — KG_VHS_TRACKS alimenté (JUKE_TRACKS intact).";
      note.className = "pass";
    } else if (st.status === "ready" && st.fromCache) {
      note.textContent = "~ Chargé depuis le cache (backend injoignable).";
      note.className = "warn";
    } else {
      note.textContent = "✗ Aucune donnée : backend injoignable et aucun cache/snapshot. Catalogue inchangé.";
      note.className = "fail";
    }
    render();
  });

  // Live re-render on manual reload
  document.addEventListener("keydown", function (e) {
    if (e.key === "r") { window.KGVHSLibrary.invalidate(); window.KGVHSLibrary.ready().then(render); }
  });
})();
</script>
</body>
</html>
