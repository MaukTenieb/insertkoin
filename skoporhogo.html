<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Skoporhogo — Korhogo Fauna</title>
<meta name="robots" content="index,follow,noai,noimageai">
<link rel="icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
  :root{ --k:#000; --w:#fff; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; background:var(--k); color:var(--w);
    font-family:'VT323',ui-monospace,Menlo,Consolas,monospace; font-size:20px; line-height:1.1; }
  body{ display:flex; flex-direction:column; min-height:100vh; }
  header{ display:flex; align-items:center; gap:14px; padding:8px 16px; border-bottom:2px solid var(--w); flex-wrap:wrap; }
  #speeds{ display:flex; gap:6px; flex-wrap:wrap; }
  button{ font:inherit; font-size:22px; background:var(--k); color:var(--w); border:2px solid var(--w);
    padding:2px 10px; cursor:pointer; border-radius:0; }
  button:hover{ background:var(--w); color:var(--k); }
  button.on{ background:var(--w); color:var(--k); }
  #lang{ margin-left:auto; }
  main{ flex:1; display:flex; gap:0; min-height:0; }
  #stage{ flex:1; display:flex; align-items:center; justify-content:center; min-width:0; padding:8px; }
  #view{ touch-action:none; image-rendering:pixelated; image-rendering:crisp-edges; display:block; cursor:pointer; border:2px solid var(--w); }
  aside{ width:360px; border-left:2px solid var(--w); padding:12px; display:flex; flex-direction:column; gap:12px; overflow:auto; }
  [hidden]{ display:none !important; }
  #card{ border:2px solid var(--w); padding:10px; }
  #cbody{ display:grid; grid-template-columns:112px 1fr; gap:4px 12px; align-items:start; }
  #pcv{ width:112px; height:112px; image-rendering:pixelated; display:block; border:2px solid var(--w); grid-row:1/4; }
  #cname{ font-size:28px; line-height:1; }
  #cact{ min-height:20px; font-size:19px; }
  #bars{ grid-column:1/3; margin-top:6px; }
  .bar{ display:flex; align-items:center; gap:8px; margin:3px 0; }
  .bar span{ width:96px; }
  .bar i{ flex:1; height:12px; border:2px solid var(--w); position:relative; }
  .bar b{ position:absolute; left:0; top:0; bottom:0; background:var(--w); }
  #hint{ text-align:center; padding:24px 0; }
  #roster{ display:grid; grid-template-columns:1fr; gap:4px; }
  .row{ display:grid; grid-template-columns:34px minmax(0,1fr) auto; grid-template-rows:auto auto; column-gap:8px; align-items:center;
    text-align:left; padding:3px 6px; font-size:19px; }
  .row img{ grid-row:1/3; width:34px; height:34px; image-rendering:pixelated; border:1px solid currentColor; }
  .row .nm{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row .rm{ font-size:15px; border:1px solid currentColor; padding:0 5px; white-space:nowrap; }
  .row .vb{ grid-column:2/4; font-size:17px; opacity:.85; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row.on .vb{ opacity:1; }
  @media (max-width:1180px){ aside{ width:300px; } }
  @media (max-width:900px){
    main{ flex-direction:column; }
    #stage{ padding:2px; }
    aside{ width:auto; border-left:none; border-top:2px solid var(--w); overflow:visible; }
    #roster{ grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); }
    header{ padding:8px 16px; gap:8px; }
    button{ font-size:20px; padding:2px 8px; }
  }
</style>
</head>
<body>
<header>
  <div id="speeds"></div>
  <div id="zoom" style="display:flex;gap:6px"></div>
  <button id="lang">FR</button>
</header>
<main>
  <div id="stage"><canvas id="view"></canvas></div>
  <aside>
    <div id="card"><div id="hint"></div><div id="cbody" hidden>
      <img id="pcv" alt="">
      <div id="cname"></div><div id="cact"></div><div id="bars"></div>
    </div></div>
    <div id="roster"></div>
  </aside>
</main>

function findPath(sx,sz,tx,tz,avoid,self){
  if(!walk(tx,tz)) return null; if(sx===tx&&sz===tz) return [];

  const h=(x,z)=>{ const dx=Math.abs(x-tx),dz=Math.abs(z-tz); return Math.max(dx,dz)+.414*Math.min(dx,dz); };
  while(open.length){
    let bi=0; for(let i=1;i<open.length;i++) if(f[open[i]]<f[open[bi]]) bi=i;
    const cur=open.splice(bi,1)[0]; if(closed[cur]) continue; closed[cur]=1;

    for(let dx=-1;dx<=1;dx++) for(let dz=-1;dz<=1;dz++){
      if(!dx&&!dz) continue; const nx=cx+dx, nz=cz+dz; if(!walk(nx,nz)) continue;
      if(dx&&dz&&(!walk(cx+dx,cz)||!walk(cx,cz+dz))) continue;
      const ni=I(nx,nz); if(closed[ni]) continue;
      if(avoid && occ[ni]>=0 && occ[ni]!==self && !(nx===tx&&nz===tz)) continue;
      const ng=g[cur]+(dx&&dz?1.414:1)+(occ[ni]>=0&&occ[ni]!==self?.6:0);
      if(ng<g[ni]){ g[ni]=ng; f[ni]=ng+h(nx,nz); from[ni]=cur; open.push(ni); }
    }
  }

}

    else if(k==='drink'){ A[1].rotation.x=-1.4-Math.max(0,Math.sin(t*1.6))*.9; A[1].rotation.z=-.3; }
    else if(k==='exercise'){ const b=Math.abs(Math.sin(t*5+a.id)); A[0].rotation.z=-.2-b*2.4; A[1].rotation.z=.2+b*2.4; L[0].rotation.z=-b*.3; L[1].rotation.z=b*.3; f.g.position.y=b*.06; }

});

function fit(){
  const st=document.getElementById('stage'), mob=innerWidth<=900;
  const aw=st.clientWidth-(mob?4:20), ah=mob?innerHeight*.62:Math.max(240,st.clientHeight-20);
  let k=Math.min(aw/W,ah/H); if(k>=1) k=Math.floor(k*4)/4;
  view.style.width=Math.round(W*k)+'px'; view.style.height=Math.round(H*k)+'px';
}
addEventListener('resize',fit); fit();


// =========================================================
//  LOOP
// =========================================================
let last=performance.now(), cardT=0;
function frame(now){
  const rdt=Math.min(.1,(now-last)/1000); last=now; const t=now/1000;
  let g=rdt*SPEEDS[speedI];
  while(g>0){ const s=Math.min(g,.2); stepSim(s); g-=s; }
  visuals(rdt,t); environment(rdt,t);
  if(VIEW.follow&&selected>=0&&VIEW.z>1.01){ const a=AG[selected], v=new THREE.Vector3(a.px,.6,a.pz).applyMatrix4(cam.matrixWorldInverse);
    VIEW.x+=(v.x-CAM0.cx-VIEW.x)*Math.min(1,rdt*3); VIEW.y+=(v.y-CAM0.cy-VIEW.y)*Math.min(1,rdt*3); applyView(); }
  cardT+=rdt; if(cardT>.25){ cardT=0; updateCard(); }
  renderer.setRenderTarget(rt); renderer.render(scene,cam);
  renderer.setRenderTarget(null); renderer.render(postScene,postCam);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__room={step:stepSim,AG,SP,setSpeed,get tMin(){return tMin;},set tMin(v){tMin=v;},occ,select};
})();
</script>
