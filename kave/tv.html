#osd .ln{display:block;max-width:100%;overflow:hidden;white-space:nowrap}#osd .ln i{font-style:normal;display:inline-block}#osd .ln.tp i{animation:tpr var(--tt,4s) linear 1s infinite alternate}@keyframes tpr{to{transform:translateX(var(--dx))}}

/* 12 nov. (Mauk Tenieb) : l'heure et le temps du lieu du visiteur, tirés du fuseau de son appareil */
#meteo{background:linear-gradient(#0a1a4a,#06102e 70%,#040a1e);color:#e8eef8;font-family:"VT323",monospace;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;line-height:1}
#meteo.on{display:flex}#meteo .h{font-size:calc(var(--tw,300px)*.21);letter-spacing:.04em;text-shadow:0 0 8px rgba(120,170,255,.5)}#meteo .s{font-size:calc(var(--tw,300px)*.07);color:#9fb8e8}#meteo .c{font-size:calc(var(--tw,300px)*.085);margin-top:.5em;color:#ffd36a;text-transform:uppercase}#meteo .w{font-size:calc(var(--tw,300px)*.13);margin-top:.2em}#meteo .d{font-size:calc(var(--tw,300px)*.065);color:#c8d4ee;text-transform:uppercase}

/* 10 nov. (Mauk Tenieb, 21 h 11) : télécommande rangée, elle dépasse franchement, s'éclaire et se soulève par moments pour appeler l'appui */

/* 13 nov. 2026 (Mauk Tenieb : « faut qu'elle bouge, mais pas qu'elle soit décapitée » ; 5 h 30 : « la télécommande flotte ») : le saut d'origine revient (translate) ; la télécommande repliée descend de 18 px sous la barre, sa coupe reste cachée pendant le saut */body.rup:not(.ropen) #remote{height:calc(var(--rv) + 18px)!important}@keyframes rnudge{0%,78%,100%{translate:0 0}86%{translate:0 -14px}92%{translate:0 -4px}}
@media (prefers-reduced-motion:reduce){body.rup:not(.ropen) #remote{animation:none}#devise .strip{animation:none}#slide i{transition:none}}
#devise{background:radial-gradient(ellipse at 50% 40%,#2a1c10,#000 75%)}#devise img{position:absolute;left:50%;bottom:22%;height:72%;transform:translateX(-50%);filter:saturate(.85) contrast(1.05)}

#devise b{display:block;font-size:clamp(12px,2.6vmin,24px);letter-spacing:.08em;text-transform:uppercase;color:#ffd200}#devise p{margin:.3em 0 0;font-size:clamp(12px,2.2vmin,20px);font-style:italic}
/* canal guide, rétabli le 13 nov. 2026 (Mauk Tenieb : « que le programme TV s'affiche dans l'écran, en bleu, un genre de télétexte ») */#gpv{display:grid;place-items:center;background:#0a1240}.gr .s .tp,#gh .tp,#gp .tp{display:inline-block;animation:tpr 6s ease-in-out 1s infinite alternate}#gnum{font:700 clamp(40px,14vmin,140px)/1 Arimo,Arial,sans-serif;color:#ffd200}

#room{display:block;padding:0;background:#050403;overflow:hidden}

#kvol{left:63.953%;top:40.234%;width:2.035%;aspect-ratio:2;border-radius:3px}

/* 8 nov. (point 3) : lecture du guide — 12 px au moins au bureau ; au téléphone, écran agrandi, 14 px au moins à l'œil */

addEventListener('storage',function(e){if(e.key!=='ik.lang')return;lang=e.newValue==='fr'?'fr':'en';F=lang==='fr';document.documentElement.lang=lang;if(window.KGVHSRecorder&&KGVHSRecorder.refresh)KGVHSRecorder.refresh();if(txt)renderPage(page)});
/* ---------- 10 nov. (Mauk Tenieb : « cette télé reprend la totalité des fonctionnalités de Video ») : la position AV ; le programme VHS de la borne, chargé tel quel par kg-loader.js, devient le magnétoscope branché sur ce poste ---------- */
function cut(t,n){t=String(t).trim();return t;var c=t.slice(0,n-1),i=c.lastIndexOf(' ');return (i>n*.5?c.slice(0,i):c).replace(/[\s,;:.\-–—]+$/,'')+'…'}
function esc(t){return String(t).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}
function loadJs(src){return new Promise(function(ok,ko){var e=document.createElement('script');e.src=src;e.onload=ok;e.onerror=ko;document.body.appendChild(e)})}
var vhsReady=null;
function vhsLoad(){if(vhsReady)return vhsReady;window.INSERTKOIN_VHS_CONFIG=Object.assign({},window.INSERTKOIN_VHS_CONFIG,{layout:false});
 vhsReady=new Promise(function(ok){clipIds(ok)}).then(function(){if(!window.JUKE_TRACKS)window.JUKE_TRACKS=CP.raw||[];return window.KGVHSLibrary?0:loadJs('../kg-vhs-library.js')}).then(function(){return window.IKK?0:loadJs('../ik-kuration.js')}).then(function(){return window.KG?0:loadJs('../kg-loader.js')});
 vhsReady.catch(function(){vhsReady=null});return vhsReady}
function track(){if(!av)return;var r=$('#bezel').getBoundingClientRect(),k=[r.left,r.top,r.width,r.height].map(Math.round).join();if(k!==track.k){track.k=k;RE.setProperty('--vx',r.left+'px');RE.setProperty('--vy',r.top+'px');RE.setProperty('--vw',r.width+'px');RE.setProperty('--vh',r.height+'px')}requestAnimationFrame(track)}
function avOn(){if(av||!power)return;av=true;entry='';txt=0;$('#ttx').className='layer';clip(false);msnd();document.body.classList.add('av');var sn=$('#snow');sn.classList.add('on');setTimeout(function(){sn.classList.remove('on')},500);osd('AV');fit();track.k='';track();
 vhsLoad().then(function(){if(av)return KG.open('vhs')}).then(function(){if(!av){try{KGVHS.close();KG.close('vhs')}catch(e){}return}if(window.KGVHS&&KGVHS.volume)KGVHS.volume(mute?0:vol*2.5)}).catch(function(){osd('AV<br>– – –')})}
function avOff(n){if(!av)return;av=false;try{if(window.KGVHS)KGVHS.close()}catch(e){}try{if(window.KG)KG.close('vhs')}catch(e){}document.body.classList.remove('av');hushVhs(false);fit();if(n&&n!==ch)zap(n);else{draw();osd(p2(ch))}}
addEventListener('kg-vhs:close',function(){if(av)avOff(ch)});
var hushed=false;function hushVhs(v){if(v===hushed)return;hushed=v;if(window.IKMotel&&IKMotel.hush)IKMotel.hush('vhs',v)}
/* le Motel Sound se tait pendant la lecture d'une cassette */
setInterval(function(){var st=av&&window.KGVHS&&KGVHS.debug?KGVHS.debug().status:'Stop';hushVhs(av&&(st==='Play'||st==='Load'))},400);
function vbtn(a){return document.querySelector("#vhs [data-vhs-action='"+a+"']")}
function vact(a){var b=vbtn(a);if(b&&!b.disabled)b.click()}
function vfield(sel){var f=document.querySelector('#vhs '+sel);if(f&&f.offsetParent){f.scrollIntoView({block:'center'});try{f.focus({preventScroll:true})}catch(e){}}return f}
function trackOsd(){setTimeout(function(){var l=document.querySelector('#vhs [data-vhs-osd-track]');if(l)osd('AV<br>'+esc(cut(l.textContent.toUpperCase(),60)),3000)},80)}
/* CH+ / CH− : la cassette suivante ou précédente de l'étagère, mise en lecture */
function tape(d){var sh=document.querySelector('#vhs [data-vhs-shelf]'),a=sh&&!sh.hidden?[].slice.call(sh.querySelectorAll('[data-vhs-tape-all],[data-vhs-shelf-row] .vhs-tape')).filter(function(b){return !b.hidden}):[];if(!a.length){osd('AV<br>– – –');return}
 var i=0;a.forEach(function(b,j){if(b.classList.contains('is-active'))i=j});var b=a[(i+d+a.length)%a.length];b.click();try{b.scrollIntoView({block:'nearest',inline:'nearest'})}catch(e){}
 var nm=b.querySelector('.vhs-tape-name');osd('AV<br>'+esc(cut((nm?nm.textContent:'').toUpperCase(),60)),3000);setTimeout(function(){if(av&&window.KGVHS&&KGVHS.debug().status!=='Play')vact('play')},350)}
/* la télécommande en position AV : POWER, 1 à 6 et TXT rendent les chaînes ; CH± les cassettes ; 7 et 9 la piste précédente et suivante, 8 et le toucher de l'image lecture et pause ; R l'enregistreur, G le hasard, Y le cœur de la Korhogo Kuration, C la recherche ; VOL et MUTE le son du magnétoscope */
function avKey(k){
 if(k==='power'){avOff(ch);return true}
 if(/^[1-6]$/.test(k)){avOff(+k);return true}
 if(k==='0'){osd('AV');return true}
 if(k==='7'||k==='9'){if(window.KGVHS&&KGVHS.step){KGVHS.step(k==='7'?-1:1);trackOsd()}return true}
 if(k==='8'||k==='ok'){vact('play');return true}
 if(k==='chup'||k==='chdn'){tape(k==='chup'?1:-1);return true}
 if(k==='red'){var f=vfield('[data-vhs-rec-input]');if(f&&f.value.trim()){var rb=document.querySelector('#vhs [data-vhs-rec-btn]');if(rb)rb.click()}return true}
 if(k==='green'){vact('random');trackOsd();return true}
 if(k==='yellow'){vact('heart');return true}
 if(k==='cyan'){vfield('[data-vhs-find-input]');return true}
 if(k==='txt'||k==='mix'){avOff(ch);key(k);return true}
 if(k==='mute'){vact('mute');var mb=vbtn('mute');mute=!!(mb&&mb.getAttribute('aria-pressed')==='true');showVol();return true}
 if(k==='volup'||k==='voldn'){vol=Math.max(0,Math.min(40,vol+(k==='volup'?2:-2)));var m2=vbtn('mute');if(m2&&m2.getAttribute('aria-pressed')==='true')vact('mute');mute=false;showVol();if(window.KGVHS&&KGVHS.volume)KGVHS.volume(vol*2.5);return true}
 return false}
/* titre de l'onglet : l'enseigne */
setInterval(function(){var r=Math.random();document.title=(r<.7?'Insert Koin':['Intersektion','Sektor Inn','Noir Insekt'][Math.floor(Math.random()*3)])+' — TV'},6000);
fit();document.fonts&&document.fonts.ready.then(function(){draw()});draw();
})();
