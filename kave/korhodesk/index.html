<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KorhoDesk</title>
<link rel="canonical" href="https://mauktenieb.github.io/insertkoin/kave/korhodesk/">
<meta name="robots" content="noai, noimageai">
<meta name="description" content="Korhogo Motel reception. Postulants of the Korhogo Fauna receive a numbered key, signed and anchored in Bitcoin through OpenTimestamps.">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0a0807;color:#efe7d6;overflow:hidden;font-family:"Helvetica Neue",Arial,sans-serif}
button,a{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-decoration:none}
#blur{position:fixed;inset:-40px;background:center/cover no-repeat;filter:blur(30px) brightness(.35)}
/* scène à proportions fixes : mêmes rapports sur tous les écrans */
#stage{--ar:1376/768;position:fixed;left:50%;translate:-50% -50%;aspect-ratio:var(--ar);container-type:size;
  background:center/100% 100% no-repeat}
.o{position:absolute;display:block}
.o img{filter:drop-shadow(0 .8cqmin 1.2cqmin rgba(0,0,0,.65));width:100%;height:auto;display:block;pointer-events:none;user-select:none}
#neon img{filter:none;mix-blend-mode:screen;animation:buzz 8s infinite}
@keyframes buzz{0%,90%,100%{opacity:1}91%{opacity:.4}92%{opacity:1}94%{opacity:.7}95%{opacity:1}}
#neonglow{position:absolute;inset:-30%;background:radial-gradient(ellipse,rgba(255,60,40,.22),transparent 65%);mix-blend-mode:screen;pointer-events:none}
/* tableau des tarifs */
#board img{border-radius:3.6%/4.6%}
#board{filter:brightness(.62);transition:filter .6s;container-type:inline-size}
#board.lit{filter:brightness(1.05)}
#felt{position:absolute;left:5.9%;right:5.7%;top:7.3%;bottom:9.4%;display:flex;flex-direction:column;justify-content:space-between;padding:4% 5%}
.L{font-family:"Arial Narrow","Helvetica Neue Condensed",Arial,sans-serif;font-weight:700;color:#f3efe6;letter-spacing:.06em;
  text-shadow:0 .08em 0 rgba(0,0,0,.85),0 0 .05em rgba(255,255,255,.4)}
.row{width:100%;display:flex;justify-content:space-between;align-items:baseline;white-space:nowrap;font-size:6.6cqw;line-height:1.15}
.row:nth-child(2n){transform:rotate(-.25deg)}.row:nth-child(3n){transform:translateX(.08em)}
.row:hover,.row:focus-visible{color:#fff;text-shadow:0 0 .4em rgba(255,255,255,.6);outline:none}
#clear{font:2.7cqw/1.35 "Helvetica Neue",Arial,sans-serif;color:#bcae94;text-align:center;letter-spacing:.02em;white-space:normal;text-shadow:none}
/* tableau à clés */
.tag{position:absolute;width:5.4%;aspect-ratio:1;translate:-50% 0;border-radius:50%;
  background:radial-gradient(circle at 32% 28%,#fff1bd,#c9a24a 42%,#6e5216 100%);
  box-shadow:0 .3cqmin .6cqmin rgba(0,0,0,.75),inset 0 0 0 .25cqmin rgba(80,55,10,.6);
  font:700 1.3cqmin/1 "Courier New",monospace;color:#3f2c0b;display:flex;align-items:center;justify-content:center;
  transform-origin:50% -35%;animation:sway 6s ease-in-out infinite;animation-delay:calc(var(--d)*-1s)}
.tag::before{content:"";position:absolute;top:-38%;left:50%;width:22%;height:42%;translate:-50% 0;border:.25cqmin solid #a8862f;border-radius:50% 50% 40% 40%}
.tag.off{filter:grayscale(.85) brightness(.55)}
@keyframes sway{0%,100%{rotate:-2deg}50%{rotate:2deg}}
#bell{cursor:pointer}
#bell:active{translate:0 .3cqmin}
#lang{position:absolute;right:1.6%;bottom:2.4%;font:700 2.2cqmin/1 "Courier New",monospace;color:#c9a24a;opacity:.8}
#racknav{position:absolute;display:flex;gap:2cqmin;font:700 2cqmin/1 "Courier New",monospace;color:#c9a24a}
/* fiche */
#key{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(6,4,3,.84);backdrop-filter:blur(3px);container-type:size}
#key.on{display:flex}
#card{position:relative;height:min(92cqh,92cqw*993/682);aspect-ratio:682/993;background:url(img/card.webp) center/100% 100% no-repeat;
  color:#2a2217;font-family:"Courier New",monospace;filter:drop-shadow(0 2cqmin 3cqmin rgba(0,0,0,.8));animation:drop .5s cubic-bezier(.3,1.4,.5,1);container-type:size}
@keyframes drop{from{transform:translateY(-30vh) rotate(-7deg);opacity:0}}
#coin{position:absolute;left:50%;top:2.5%;width:30%;aspect-ratio:1;translate:-50% 0;border-radius:50%;
  background:radial-gradient(circle at 32% 28%,#fff1bd,#c9a24a 42%,#6e5216 100%);
  box-shadow:inset 0 0 0 .9cqw rgba(80,55,10,.55),0 1.4cqw 2.6cqw rgba(0,0,0,.45);
  display:flex;align-items:center;justify-content:center;font:700 9cqw/1 "Courier New",monospace;color:#3f2c0b;animation:spin 3.2s ease-in-out infinite}
@keyframes spin{0%,100%{transform:perspective(600px) rotateY(-36deg)}50%{transform:perspective(600px) rotateY(36deg)}}
#dl{position:absolute;left:8%;right:28%;top:41.2%;display:grid;grid-template-columns:auto 1fr;column-gap:4cqw;font-size:3.1cqh;line-height:5.32cqh}
#dl dt{color:#7a6a50}#dl dd{overflow:hidden;white-space:nowrap}
#stamp{position:absolute;right:7%;top:30%;rotate:-12deg;border:.6cqw solid currentColor;padding:.6cqw 1.6cqw;font-weight:700;font-size:4.4cqw;letter-spacing:.1em;opacity:.85;mix-blend-mode:multiply}
#stamp.ok{color:#a8221a}#stamp.bad{color:#555}
.acts{position:absolute;left:0;right:0;bottom:6%;display:flex;justify-content:center;gap:12cqw;font-size:6cqw}
#slip{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(6,4,3,.84);backdrop-filter:blur(3px);container-type:size;z-index:5}
#slip.on{display:flex}
#note{position:relative;height:min(88cqh,86cqw*993/682);aspect-ratio:682/993;background:url(img/card.webp) center/100% 100% no-repeat;color:#2a2217;font-family:"Courier New",monospace;
  container-type:size;filter:drop-shadow(0 2cqmin 3cqmin rgba(0,0,0,.8));animation:drop .45s cubic-bezier(.3,1.4,.5,1);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3cqh;text-align:center;padding:18cqh 9cqw 10cqh}
#ntier{font-size:6cqw;letter-spacing:.08em}
#ntag{font:700 13cqw/1 "Courier New",monospace;letter-spacing:.12em;color:#1d1710;border:.5cqw dashed #8a7a5a;padding:2cqh 4cqw}
#nhint{font-size:3.8cqw;color:#6a5a40}
#ncode{font-size:3cqw;color:#8a7a5a;word-break:break-all}
.acts2{display:flex;gap:9cqw;align-items:center;font-size:6cqw}
#npay{font-weight:700;border:.5cqw solid #2a2217;padding:1cqh 3cqw;color:#2a2217}
.tag.mine{box-shadow:0 0 1.4cqmin .5cqmin rgba(255,214,120,.9),0 .3cqmin .6cqmin rgba(0,0,0,.75)}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div id="blur"></div>
<main id="stage">
  <div class="o" id="neon"><div id="neonglow"></div><img src="img/neon.webp" alt="VACANCY"></div>
  <section class="o" id="board" aria-label="Rates">
    <img src="img/board.webp" alt="">
    <div id="felt" class="L">
      <div id="rows"></div>
      <p id="clear"></p>
    </div>
  </section>
  <section class="o" id="rack" aria-label="Hall of Fame"><img src="img/rack.webp" alt=""></section>
  <nav id="racknav" hidden></nav>
  <button class="o" id="bell" aria-label="Ring"><img src="img/bell.webp" alt=""></button>
</main>

<div id="slip" role="dialog" aria-modal="true">
  <article id="note">
    <p id="ntier"></p>
    <p id="ntag"></p>
    <p id="nhint"></p>
    <p id="ncode"></p>
    <div class="acts2">
      <button id="ncopy" title="copy">⧉</button>
      <a id="npay" target="_blank" rel="noopener">PayPal ↗</a>
      <button id="nclose" title="close">✕</button>
    </div>
  </article>
</div>

<div id="key" role="dialog" aria-modal="true">
  <article id="card">
    <div id="coin"></div>
    <div id="stamp"></div>
    <dl id="dl"></dl>
    <div class="acts">
      <button id="dl-png" title="PNG">⤓</button>
      <a id="ln" title="link">⛓</a>
      <button id="close" title="close">✕</button>
    </div>
  </article>
</div>

<script>
const PAYPAL='https://www.paypal.me/mauktenieb/',LN='';
const MASKS=['Unkle Maukie','dogXim','C7H5N3O6','Naphta','Ts\'ui Pen','Honey Buzzard','Hatra Loves','Croisiere Noire','Aube','Silent Pact','Maiden Call','Plague of Justinian','Poisoned Well','Cadaver Synod','Truce','Auvergne','Grand Colonel','Malika'];
const TIERS=[[1,'kalabass'],[5,'[K]alabass'],[10,'KALABASS'],[50,'[k]ALABASS'],[99,"[K]ALEB'S ASS"]];
const B32='ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';const b32=u=>{let b=0,v=0,o='';for(const x of u){v=(v<<8)|x;b+=8;while(b>=5){o+=B32[(v>>>(b-5))&31];b-=5}}return o};
async function tagOf(code){return b32(new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(code)))).slice(0,8)}
const today=()=>new Date().toISOString().slice(0,10);
function myCodes(){try{return JSON.parse(localStorage.getItem('kd.codes')||'[]')}catch(e){return[]}}
// positions en % de la scène : [gauche, haut, largeur]
const LAYOUT={
  land:{bg:'img/room-land.webp',ar:'1376/768',neon:[3,9,24],board:[2,22,26],rack:[47,14,23],bell:[49,60.4,6],nav:[47,49]},
  port:{bg:'img/room-port.webp',ar:'768/1376',neon:[21,7,58],board:[22,17.5,56],rack:[25,41.6,42],bell:[76,60.2,12],nav:[25,61.5]}
};
// crochets du tableau (px de rack.webp 852×692)
const HX=[62,136,208,282,355,428,500,572,646,718,791],HY=[58,128,200,271,345,414,483,549,612];
const T={
 en:{clear:'Euros · PayPal · 100 % to Korhogo · 31 nights per key',hint:'Paste in the PayPal note',keep:'Your room code, kept in this browser:',until:'Until',eur:'Paid',
  n:'Key',tier:'Kalabass',since:'Since',who:'Postulant',rh:'Rhythm',m:'monthly',o:'once',anon:'—',ok:'SIGNED',bad:'UNSIGNED',st:'Status',live:'active',past:'archived'},
 fr:{clear:'Euros · PayPal · 100 % pour Korhogo · 31 nuits par clé',hint:'À coller dans la note PayPal',keep:'Votre code de chambre, gardé dans ce navigateur :',until:'Jusqu’au',eur:'Versé',
  n:'Clé',tier:'Kalabass',since:'Depuis',who:'Postulant',rh:'Rythme',m:'mensuel',o:'une fois',anon:'—',ok:'SIGNÉE',bad:'NON SIGNÉE',st:'État',live:'active',past:'archivée'}
};
let lang=(()=>{try{return localStorage.getItem('ik.lang')==='fr'?'fr':'en'}catch(e){return 'en'}})();
let reg={keys:[],rack:99,pub:''},rack=1;
const $=s=>document.querySelector(s);

function layout(){
  const bar=document.getElementById('ikbar'),bh=bar?bar.offsetHeight||52:0,ah=innerHeight-bh;
  const L=innerWidth>=ah?LAYOUT.land:LAYOUT.port,st=$('#stage'),[aw,ahh]=L.ar.split('/').map(Number),r=aw/ahh,w=Math.min(innerWidth,ah*r);
  st.style.width=w+'px';st.style.top=(ah/2)+'px';
  st.style.setProperty('--ar',L.ar);st.style.backgroundImage=`url(${L.bg})`;$('#blur').style.backgroundImage=`url(${L.bg})`;
  for(const id of ['neon','board','rack','bell']){const [x,y,w]=L[id],e=$('#'+id);e.style.left=x+'%';e.style.top=y+'%';e.style.width=w+'%'}
  const n=$('#racknav');n.style.left=L.nav[0]+'%';n.style.top=L.nav[1]+'%';
}
addEventListener('resize',layout);

function paint(){
  const t=T[lang];document.documentElement.lang=lang;
  document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t[e.dataset.t]);
  $('#rows').innerHTML=TIERS.map(([d,n])=>`<button class="row" data-d="${d}" data-n="${n}"><span>${n}</span><span>${d} €</span></button>`).join('');
  $('#rows').querySelectorAll('.row').forEach(r=>r.addEventListener('click',()=>{ding();slip(+r.dataset.d,r.dataset.n)}));
  $('#clear').textContent=t.clear;
}

async function slip(d,n){
  const t=T[lang];let c=myCodes();let me=c[c.length-1];
  if(!me){const r=crypto.getRandomValues(new Uint8Array(13));const code=MASKS[r[0]%18]+'-'+b32(r.slice(1)).match(/.{1,5}/g).join('-');me={code,tag:await tagOf(code)};c.push(me);try{localStorage.setItem('kd.codes',JSON.stringify(c))}catch(e){}}
  $('#ntier').textContent=n+' · '+d+' €';$('#ntag').textContent=me.tag;$('#nhint').textContent=t.hint;$('#ncode').textContent=t.keep+' '+me.code;
  $('#npay').href=PAYPAL+d+'EUR';$('#ncopy').onclick=()=>{try{navigator.clipboard.writeText(me.tag)}catch(e){};click()};
  $('#slip').classList.add('on');
}
$('#nclose').onclick=()=>$('#slip').classList.remove('on');
$('#slip').onclick=e=>{if(e.target.id==='slip')$('#nclose').onclick()};
let ac;const A=()=>ac||(ac=new(window.AudioContext||window.webkitAudioContext)());
function ding(){try{const a=A(),t=a.currentTime;[[2093,.22,1.9],[5440,.08,1.2],[8820,.04,.6]].forEach(([f,v,d])=>{const o=a.createOscillator(),g=a.createGain();o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d)})}catch(e){}}
function click(){try{const a=A(),b=a.createBuffer(1,a.sampleRate*.03,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.exp(-i/120);const s=a.createBufferSource();s.buffer=b;s.connect(a.destination);s.start()}catch(e){}}
$('#bell').onclick=()=>{ding();$('#board').classList.add('lit')};

let MINE=new Set();
function drawRack(){
  const per=reg.rack||99,racks=Math.max(1,Math.ceil(Math.max(...reg.keys.map(k=>k.n),0)/per));
  const box=$('#rack');box.querySelectorAll('.tag').forEach(e=>e.remove());
  reg.keys.filter(k=>k.rack===rack).forEach(k=>{const i=(k.n-1)%per,b=document.createElement('button');
    b.className='tag'+(k.until>=today()?'':' off')+(MINE.has(k.tag)?' mine':'');b.textContent=k.n;b.title=k.name||'';b.style.setProperty('--d',(k.n*1.7)%6);
    b.style.left=HX[i%11]/852*100+'%';b.style.top=(HY[Math.floor(i/11)]+16)/692*100+'%';
    b.onclick=()=>{location.hash='k'+k.n};box.appendChild(b)});
  const nav=$('#racknav');nav.hidden=racks<2;
  nav.innerHTML=racks<2?'':`<button id="pv">◂</button><span>${rack}/${racks}</span><button id="nx">▸</button>`;
  if(racks>1){$('#pv').onclick=()=>{if(rack>1){rack--;drawRack()}};$('#nx').onclick=()=>{if(rack<racks){rack++;drawRack()}}}
}

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const canon=o=>JSON.stringify(o,Object.keys(o).sort());
async function verify(k){try{const key=await crypto.subtle.importKey('raw',b64(reg.pub),{name:'Ed25519'},false,['verify']);const{sig,...rest}=k;return await crypto.subtle.verify('Ed25519',key,b64(sig),new TextEncoder().encode(canon(rest)))}catch(e){return null}}
async function openKey(n){
  const k=reg.keys.find(x=>x.n===n);if(!k)return;const t=T[lang];
  $('#coin').textContent=String(n).padStart(2,'0');
  $('#dl').innerHTML=`<dt>${t.n}</dt><dd>№ ${n}${MINE.has(k.tag)?' ★':''}</dd><dt>${t.tier}</dt><dd>${k.tier}</dd><dt>${t.eur}</dt><dd>${k.eur} €</dd><dt>${t.since}</dt><dd>${k.since}</dd><dt>${t.until}</dt><dd>${k.until}</dd><dt>${t.st}</dt><dd>${k.until>=today()?t.live:t.past}</dd><dt>TAG</dt><dd>${k.tag}</dd>`;
  $('#ln').href='#k'+n;$('#stamp').textContent='';$('#stamp').className='';$('#key').classList.add('on');click();
  const ok=await verify(k);$('#stamp').textContent=ok?t.ok:t.bad;$('#stamp').className=ok?'ok':'bad';$('#dl-png').onclick=()=>png(k,ok);
}
function png(k,ok){
  const img=new Image();img.onload=()=>{const c=document.createElement('canvas');c.width=682*2;c.height=993*2;const x=c.getContext('2d');x.drawImage(img,0,0,c.width,c.height);
    const g=x.createRadialGradient(620,240,20,682,300,205);g.addColorStop(0,'#fff1bd');g.addColorStop(.45,'#c9a24a');g.addColorStop(1,'#6e5216');
    x.fillStyle=g;x.beginPath();x.arc(682,250,205,0,7);x.fill();x.fillStyle='#3f2c0b';x.font='bold 130px Courier New';x.textAlign='center';x.textBaseline='middle';x.fillText(String(k.n).padStart(2,'0'),682,258);
    x.textAlign='left';x.textBaseline='alphabetic';x.font='44px Courier New';x.fillStyle='#2a2217';
    ['KEY № '+k.n,'KALABASS  '+k.tier,'PAID      '+k.eur+' EUR','SINCE     '+k.since,'UNTIL     '+k.until,'TAG       '+k.tag,'',location.origin+location.pathname+'#k'+k.n].forEach((s,i)=>x.fillText(s,110,850+i*105.6));
    if(ok){x.save();x.translate(1080,640);x.rotate(-.2);x.strokeStyle=x.fillStyle='#a8221a';x.lineWidth=7;x.strokeRect(-150,-50,300,100);x.font='bold 54px Courier New';x.textAlign='center';x.fillText('SIGNED',0,18);x.restore()}
    const a=document.createElement('a');a.download=`korhogo-key-${k.n}.png`;a.href=c.toDataURL('image/png');a.click()};img.src='img/card.webp';
}
$('#close').onclick=()=>{history.replaceState(null,'',location.pathname);$('#key').classList.remove('on')};
$('#key').onclick=e=>{if(e.target.id==='key')$('#close').onclick()};
addEventListener('hashchange',route);
function route(){const m=location.hash.match(/^#k(\d+)$/);if(m){const n=+m[1],k=reg.keys.find(x=>x.n===n);if(k&&k.rack!==rack){rack=k.rack;drawRack()}openKey(n)}else $('#key').classList.remove('on')}

paint();layout();setTimeout(layout,300);
fetch('registry.json',{cache:'no-store'}).then(r=>r.ok?r.json():reg).then(async j=>{reg=j;for(const c of myCodes())MINE.add(c.tag);drawRack();route()}).catch(()=>drawRack());
</script>
<script src="../panneau.js"></script>
</body>
</html>
