<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FaunaTor — Korhogo Fauna</title>
<meta name="description" content="FaunaTor — web and .onion, read through the motel.">
<link rel="icon" href="favicon.png">
<link href="fonts.css" rel="stylesheet">
<style>
:root{--gold:#c9a84c;--gold2:#ffe08a;--bg:#07060a;--dim:#8a8272}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:#fff;font-family:"DM Mono",monospace;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid rgba(201,168,76,.35);background:#0b0a08}
.brand{font-family:"Bebas Neue",sans-serif;font-size:22px;letter-spacing:.14em;color:var(--gold2);text-shadow:0 1px 6px #000;padding:0 6px 0 2px;flex-shrink:0}
.brand i{font-style:normal;color:#d32f2f}
.brand small{font-size:.74em}
body.home #url,body.home #go,body.home #tab,body.home #reload{display:none}
.tbtn{font-family:"DM Mono",monospace;font-size:13px;color:rgba(201,168,76,.85);
  background:transparent;border:1px solid rgba(201,168,76,.4);border-radius:5px;padding:8px 10px;cursor:pointer;flex-shrink:0;min-width:38px}
.tbtn:hover{border-color:var(--gold2);color:var(--gold2)}
.tbtn:disabled{opacity:.35;cursor:default}
#url{flex:1;min-width:120px;background:#000;border:1px solid rgba(201,168,76,.4);border-radius:5px;
  color:var(--gold2);font-family:"DM Mono",monospace;font-size:13px;padding:9px 11px;outline:none}
#url:focus{border-color:var(--gold)}
#go{color:#0b0805;background:var(--gold);border-color:var(--gold)}
#lang{min-width:52px;text-align:center}
#status{font-size:10px;color:var(--dim);padding:5px 10px;min-height:15px;letter-spacing:.05em}
main{flex:1;position:relative;background:#000}
#view{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
#notice{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;text-align:center;padding:24px;background:rgba(7,6,10,.97)}
#notice.show{display:flex}
#notice h1{font-family:"Bebas Neue",sans-serif;font-weight:400;font-size:30px;letter-spacing:.14em;color:var(--gold2);margin:0}
#notice p{max-width:52ch;color:#d9d1be;font-size:12px;line-height:1.7;margin:0}
#notice .tbtn{font-size:12px;padding:11px 22px}
@media (max-width:640px){header{flex-wrap:wrap}.brand{font-size:18px}#url{width:100%;flex-basis:100%;order:9}}
</style>
</head>
<body>
<header>
  <span class="brand">F<small>AUNA</small>T<small>OR</small><i>●</i></span>
  <button class="tbtn" id="back" aria-label="back">◀</button>
  <button class="tbtn" id="fwd" aria-label="forward">▶</button>
  <button class="tbtn" id="reload" aria-label="reload">⟳</button>
  <button class="tbtn" id="home" aria-label="home">⌂</button>
  <input id="url" spellcheck="false" autocomplete="off">
  <button class="tbtn" id="go" aria-label="go">→</button>
  <button class="tbtn" id="tab" aria-label="new tab">↗</button>
  <button class="tbtn" id="lang" hidden>FR</button>
</header>
<div id="status"></div>
<main>
  <iframe id="view" title="FaunaTor" referrerpolicy="no-referrer" sandbox="allow-scripts allow-forms allow-popups allow-popups-to-escape-sandbox allow-same-origin"></iframe>
  <div id="notice"><h1 id="ntitle"></h1><p id="ntext"></p><button class="tbtn" id="naction" style="display:none"></button>
    <span style="color:var(--dim);font-size:11px" id="nhint"></span></div>
</main>
<script>
(function(){
'use strict';
var LANG='fr';
try{LANG=localStorage.getItem('ik.lang')||localStorage.getItem('tor.lang')||'en';if(LANG!=='fr')LANG='en';}catch(e){}
function L(fr,en){return LANG==='en'?en:fr;}
function $(id){return document.getElementById(id);}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function status(t){$('status').textContent=t||'';}
function setLang(l){LANG=l==='en'?'en':'fr';try{localStorage.setItem('tor.lang',LANG);localStorage.setItem('ik.lang',LANG);}catch(e){}
  document.documentElement.lang=LANG;
  document.querySelectorAll('[data-l]').forEach(function(el){var p=el.getAttribute('data-l').split('|');el.textContent=p[LANG==='en'?1:0];});
  $('url').placeholder='';
  $('url').setAttribute('aria-label',L('Recherche ou adresse','Search or address'));
  $('lang').textContent=LANG==='en'?'FR':'EN';}

var history_=[],hi=-1,cur=null,reloadFn=null;
function mark(url){if(cur===url)return;history_=history_.slice(0,hi+1);history_.push(url);hi=history_.length-1;cur=url;refreshBtns();}
function refreshBtns(){$('back').disabled=hi<=0;$('fwd').disabled=hi<0||hi>=history_.length-1;}

function showNotice(t1,t2,btn,href,hint){$('ntitle').textContent=t1;$('ntext').textContent=t2;
  var b=$('naction');if(btn){b.style.display='inline-block';b.textContent=btn;b.onclick=function(){window.open(href,'_blank','noopener');};}
  else b.style.display='none';
  $('nhint').textContent=hint||'';$('notice').classList.add('show');}
function hideNotice(){$('notice').classList.remove('show');}

/* ---- .onion : sonde Tor → vue directe si Tor actif ; sinon notice + ↗ (plus de passerelles tor2web : toutes mortes) ---- */
function probeTor(u){
  var ctl=typeof AbortController!=='undefined'?new AbortController():null;
  var timer=ctl?setTimeout(function(){try{ctl.abort();}catch(e){}},12000):null;
  var opts=ctl?{signal:ctl.signal,mode:'no-cors',cache:'no-store'}:{mode:'no-cors',cache:'no-store'};
  return fetch(u,opts).then(function(){if(timer)clearTimeout(timer);return true;})
    .catch(function(){if(timer)clearTimeout(timer);return false;});
}
function nav(url,push){
  if(!url)return;
  hideNotice();document.body.classList.remove('home');
  $('url').value=url;
  reloadFn=function(){nav(url,false);};
  if(/\.onion/i.test(url)){
    var u=url.trim();
    $('tab').dataset.onion=u;
    if(push)mark('onion:'+url);
    status(L('L’applicant doit être patient…','The applicant must be patient…'));
    probeTor(u).then(function(ok){
      if(ok){sandbox(false);$('view').removeAttribute('srcdoc');$('view').src=u;status('');return;}
      var gates=onionGates(u);
      torReady.then(function(m){if(!m){torWhy='tor: not loaded';throw 0;}return m.hasOnion().then(function(ok){if(!ok){torWhy='tor: no onion client';throw 0;}return m.get(u);});})
        .then(function(r){if(!r||!r.text)throw 0;return onionInline(u,r.text).then(function(h){show(u,h,false);});})
        .catch(function(){rejected(u);});   /* the public tor2web gateways are dead or parked: Tor or nothing */
    });
    return;
  }
  $('tab').dataset.onion='';
  if(push)mark(url);
  /* the motel's own pages open as they are */
  if(!/^https?:\/\//i.test(url)){sandbox(true);$('view').removeAttribute('srcdoc');$('view').src=url;status('');return;}
  read(url).catch(function(){rejected(url);});
}

/* ---- page d'accueil : recherche DuckDuckGo (web classique) + Ahmia (.onion) ---- */
function searchPage(){
  var h='<!DOCTYPE html><html lang="'+LANG+'"><head><meta charset="utf-8"><style>'
  +'body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;background:#07060a;color:#fff;font-family:"DM Mono",monospace}'
  +'h1{font-family:"Bebas Neue",sans-serif;font-weight:400;font-size:36px;letter-spacing:.14em;color:#ffe08a;margin:0}'
  +'h1 i{font-style:normal;color:#d32f2f}'
  +'form{display:flex;gap:8px;width:min(560px,86vw)}'
  +'input{flex:1;background:#000;border:1px solid rgba(201,168,76,.5);border-radius:6px;color:#ffe08a;font:13px "DM Mono",monospace;padding:11px 12px;outline:none}'
  +'button{background:#c9a84c;color:#0b0805;border:0;border-radius:6px;font:bold 12px "DM Mono",monospace;letter-spacing:.1em;padding:0 18px;cursor:pointer}'
  +'p{color:#8a8272;font-size:11px;text-align:center;max-width:52ch;line-height:1.7;margin:0}'
  +'</style></head><body>'
  +'<form id="f"><input id="q" autofocus placeholder="'+esc(L('.onion, tags, mots-clés, URL — tape ce que tu veux.','.onion, tags, keywords, URL — type what you want.'))+'"><button aria-label="go">\u2192</button></form>'
  +'<script>document.getElementById("f").addEventListener("submit",function(e){e.preventDefault();var q=document.getElementById("q").value.trim();if(q&&parent.__torSearch)parent.__torSearch(q);});<\/script>'
  +'</body></html>';
  sandbox(true);$('view').src='about:blank';
  $('view').srcdoc=h;
}
function home(){$('url').value='';status('');hideNotice();document.body.classList.add('home');searchPage();
  reloadFn=home;if(push0)mark('home');}
var push0=false;

/* ---- FaunaTor reads through relays: every public relay is raced, the first good answer wins.
   A relay of your own (a free Cloudflare Worker, see faunator-worker.js) goes first when set:
   localStorage 'tor.relay' = 'https://your-worker.workers.dev/?url=' ---- */
var RELAY='';   /* ← your own relay, once deployed: 'https://faunator.<you>.workers.dev/?url=' */
function own(){try{return localStorage.getItem('tor.relay')||RELAY;}catch(e){return RELAY;}}
var RAW=[
  function(u){var o=own();return o?o+encodeURIComponent(u):null;},
  function(u){return 'https://api.allorigins.win/raw?url='+encodeURIComponent(u);},
  function(u){return 'https://api.cors.lol/?url='+encodeURIComponent(u);},
  function(u){return 'https://cors.x2u.in/'+u;},
  function(u){return 'https://api.codetabs.com/v1/proxy/?quest='+encodeURIComponent(u);},
  function(u){return 'https://thingproxy.freeboard.io/fetch/'+u;}
];
var JSONP=[function(u){return 'https://api.allorigins.win/get?url='+encodeURIComponent(u);}];
/* a reader that runs the page's own scripts on its side and returns the text: the last resort, and the best one for script-built pages */
function readerUrl(u){return 'https://r.jina.ai/'+u;}
function timed(url,ms,json){
  var ctl=typeof AbortController!=='undefined'?new AbortController():null;
  var t=ctl?setTimeout(function(){try{ctl.abort();}catch(e){}},ms):null;
  return fetch(url,ctl?{signal:ctl.signal}:{}).then(function(r){if(t)clearTimeout(t);if(!r.ok)throw new Error('http '+r.status);return json?r.json().then(function(j){return j&&j.contents||'';}):r.text();})
    .then(function(x){if(!x||x.length<120)throw new Error('empty');if(/^\s*(\{"error|<title>(4\d\d|5\d\d|error|access denied))/i.test(x))throw new Error('relay');return x;})
    .catch(function(e){if(t)clearTimeout(t);throw e;});
}
function any(ps){return new Promise(function(res,rej){var n=ps.length,f=0;if(!n)rej(new Error('none'));ps.forEach(function(p){p.then(res,function(){if(++f===n)rej(new Error('all'));});});});}
function fetchRaw(u){
  var ps=RAW.map(function(f){var x=f(u);return x?timed(x,11000):Promise.reject(0);}).concat(JSONP.map(function(f){return timed(f(u),11000,true);}));
  return any(ps);
}
/* Tor inside the page (faunator-tor.js): bootstraps as soon as FaunaTor opens */
var TOR=null,torReady=import('./faunator-tor.js').then(function(m){TOR=m;try{m.warm();}catch(e){}return m;}).catch(function(e){torWhy='tor: '+(e&&e.message||'not loaded');return null;});
function torGet(u){return torReady.then(function(m){if(!m)throw new Error('no tor');return m.get(u);}).then(function(r){if(!r||r.status>=500||!r.text||r.text.length<60)throw new Error('tor '+(r&&r.status));return r.text;});}
/* every road at once — the relays answer fast, Tor answers what they refuse — then the reader */
function fetchVia(u){return any([fetchRaw(u),torGet(u)]).catch(function(){return timed(readerUrl(u),20000);});}
/* the rejection, the only failure FaunaTor ever speaks */
var torWhy='';
function rejected(href){var w='';try{w=TOR&&TOR.lastWords?TOR.lastWords():'';}catch(e){}if(!w)w=torWhy||(TOR?'tor: no answer':'tor: not loaded');showNotice(L('Ton Kalabass a été rejeté.','Your Kalabass was rejected.'),L('Postule plus tard.','Apply later.'),href?'↗':null,href,w);status('');}

/* ---- a page, read: scripts out, links and forms kept inside FaunaTor ---- */
var SHIM='<script>(function(){function up(h){try{return new URL(h,document.baseURI).href;}catch(e){return null;}}'
 +'document.addEventListener("click",function(e){var a=e.target.closest&&e.target.closest("a[href]");if(!a)return;var h=a.getAttribute("href");if(!h||h.charAt(0)==="#")return;var u=up(h);if(!u||!/^https?:/i.test(u))return;e.preventDefault();parent.postMessage({torGo:u},"*");},true);'
 +'document.addEventListener("submit",function(e){var f=e.target;if((f.method||"get").toLowerCase()!=="get")return;e.preventDefault();var u=new URL(f.getAttribute("action")||location.href,document.baseURI);new FormData(f).forEach(function(v,k){u.searchParams.set(k,v);});parent.postMessage({torGo:u.href},"*");},true);})();<\/script>';
function mdToHtml(md){
  var out=[],list=false;
  md.split(/\n/).forEach(function(l){
    var t=esc(l).replace(/!\[([^\]]*)\]\((https?:[^)\s]+)\)/g,'<img alt="$1" src="$2">').replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2">$1</a>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
    var m=/^(#{1,6})\s+(.*)/.exec(l);
    if(/^\s*[-*]\s+/.test(l)){if(!list){out.push('<ul>');list=true;}out.push('<li>'+t.replace(/^\s*[-*]\s+/,'')+'</li>');return;}
    if(list){out.push('</ul>');list=false;}
    if(m){out.push('<h'+m[1].length+'>'+esc(m[2])+'</h'+m[1].length+'>');return;}
    if(/^\s*$/.test(l))return;
    out.push('<p>'+t+'</p>');
  });
  if(list)out.push('</ul>');return out.join('');
}
var READCSS='<style>body{margin:0;padding:24px 5vw 60px;background:#07060a;color:#e9e1d0;font:14px/1.7 "DM Mono",monospace;max-width:900px}a{color:#ffe08a}img{max-width:100%;height:auto}h1,h2,h3{font-family:"Bebas Neue",sans-serif;font-weight:400;letter-spacing:.06em;color:#ffe08a}</style>';
function show(url,html,md){
  var doc;
  if(md){var body=html.replace(/^[\s\S]*?Markdown Content:\s*/,'');doc='<!DOCTYPE html><html><head><meta charset="utf-8"><base href="'+esc(url)+'">'+READCSS+'</head><body>'+mdToHtml(body)+SHIM+'</body></html>';}
  else{
    var d=new DOMParser().parseFromString(html,'text/html');
    d.querySelectorAll('script,iframe,object,embed,meta[http-equiv],link[rel=preload],link[rel=modulepreload]').forEach(function(n){n.remove();});
    d.querySelectorAll('noscript').forEach(function(n){var s=d.createElement('div');s.innerHTML=n.textContent;n.replaceWith(s);});
    d.querySelectorAll('img[data-src]').forEach(function(i){if(!i.getAttribute('src'))i.setAttribute('src',i.getAttribute('data-src'));});
    d.querySelectorAll('*').forEach(function(n){for(var i=n.attributes.length-1;i>=0;i--){var at=n.attributes[i],nm=at.name.toLowerCase();if(nm.indexOf('on')===0||((nm==='href'||nm==='src'||nm==='action'||nm==='formaction'||nm==='xlink:href')&&/^\s*javascript:/i.test(at.value)))n.removeAttribute(at.name);}});
    var bs=d.querySelector('base');if(bs)bs.remove();
    var base=d.createElement('base');base.href=url;d.head.insertBefore(base,d.head.firstChild);
    var df=d.createElement('style');df.textContent='html{background:#fff;color:#111}';d.head.insertBefore(df,d.head.firstChild);
    var mc=d.createElement('meta');mc.setAttribute('charset','utf-8');d.head.insertBefore(mc,d.head.firstChild);
    doc='<!DOCTYPE html>'+d.documentElement.outerHTML.replace(/<\/body>/i,SHIM+'</body>');
    if(!/<\/body>/i.test(doc))doc+=SHIM;
  }
  sandbox(false);$('view').removeAttribute('src');$('view').srcdoc=doc;status('');
}
function sandbox(trusted){$('view').setAttribute('sandbox',trusted?'allow-scripts allow-forms allow-popups allow-popups-to-escape-sandbox allow-same-origin':'allow-scripts allow-popups allow-popups-to-escape-sandbox');}
window.addEventListener('message',function(e){if(e.source!==$('view').contentWindow||!e.data||typeof e.data.torGo!=='string')return;if(/^https?:/i.test(e.data.torGo))go(e.data.torGo,true);});
function onionInline(base,html){
  var d=new DOMParser().parseFromString(html,'text/html'),jobs=[],n=0;
  function abs(x){try{return new URL(x,base).href;}catch(e){return null;}}
  function b64(u8){var s='',i,c=0x8000;for(i=0;i<u8.length;i+=c)s+=String.fromCharCode.apply(null,u8.subarray(i,i+c));return btoa(s);}
  d.querySelectorAll('img[src]').forEach(function(im){var u=abs(im.getAttribute('src'));if(!u||!/\.onion/i.test(u)||n++>=16)return;
    jobs.push(TOR.bytes(u).then(function(b){im.setAttribute('src','data:'+(b.type||'image/*')+';base64,'+b64(b.data));}).catch(function(){}));});
  d.querySelectorAll('link[rel~=stylesheet][href]').forEach(function(l){var u=abs(l.getAttribute('href'));if(!u||!/\.onion/i.test(u))return;
    jobs.push(TOR.get(u).then(function(r){var st=d.createElement('style');st.textContent=r.text;l.replaceWith(st);}).catch(function(){}));});
  return Promise.all(jobs).then(function(){return '<!DOCTYPE html>'+d.documentElement.outerHTML;});
}
function textLen(html){try{var d=new DOMParser().parseFromString(html,'text/html');d.querySelectorAll('script,style,noscript').forEach(function(n){n.remove();});return (d.body&&d.body.textContent||'').replace(/\s+/g,' ').length;}catch(e){return 0;}}
function read(url){
  status(L('L’applicant doit être patient…','The applicant must be patient…'));
  return any([fetchRaw(url),torGet(url)]).then(function(h){
    if(textLen(h)>400){show(url,h,false);return;}
    /* a page built by its scripts: the reader runs them */
    return timed(readerUrl(url),20000).then(function(t){show(url,t,true);},function(){show(url,h,false);});
  },function(){
    return timed(readerUrl(url),20000).then(function(t){show(url,t,true);});
  });
}
/* .onion: Tor first (inside Tor Browser it opens as is), then the public gateways, through the relays */
function onionGates(u){
  var m=/^(?:https?:\/\/)?([a-z2-7]{16,56})\.onion(\/.*)?$/i.exec(u.trim());if(!m)return [];
  var h=m[1].toLowerCase(),p=m[2]||'/';
  return ['onion.ly','onion.pet','onion.ps','onion.ws'].map(function(g){return 'https://'+h+'.'+g+p;});
}
function ddgUrl(q){return 'https://html.duckduckgo.com/html/?q='+encodeURIComponent(q);}
function ahmiaUrl(q){return 'https://ahmia.fi/search/?q='+encodeURIComponent(q);}
function ddgUnwrap(href){try{var u=new URL(href,'https://html.duckduckgo.com');var ud=u.searchParams.get('uddg');return ud||u.href;}catch(e){return null;}}
function parseDdg(text){
  var out=[],doc=new DOMParser().parseFromString(text,'text/html');
  doc.querySelectorAll('a.result__a').forEach(function(a){
    var u=ddgUnwrap(a.getAttribute('href')||'');
    if(!u||!/^https?:/i.test(u))return;
    var d='';var box=a.closest('.result');if(box){var sn=box.querySelector('.result__snippet');if(sn)d=sn.textContent.trim();}
    out.push({t:a.textContent.trim(),u:u,d:d});
  });
  if(!out.length){
    /* repli texte/markdown (r.jina.ai) : liens [titre](url) — unwrap uddg, liens DDG internes écartés */
    var re=/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,m;
    while((m=re.exec(text))){
      var u2=ddgUnwrap(m[2]);
      if(!u2||!/https?:/i.test(u2))continue;
      if(/duckduckgo\.com|ahmia\.fi/i.test(u2))continue;
      out.push({t:m[1].trim(),u:u2,d:''});
    }
  }
  return out.filter(function(r){return r.t;}).slice(0,10);
}
function parseAhmia(text){
  var out=[],seen={},doc=new DOMParser().parseFromString(text,'text/html');
  doc.querySelectorAll('a[href]').forEach(function(a){
    var h=a.getAttribute('href')||'',u=null;
    if(/\.onion/i.test(h)){try{u=new URL(h,'https://ahmia.fi').href;}catch(e){}}
    else{try{var U=new URL(h,'https://ahmia.fi');var r=U.searchParams.get('redirect_url')||U.searchParams.get('u');if(r&&/\.onion/i.test(r))u=r;}catch(e){}}
    if(!u)return;
    u=u.replace(/^https?:\/\//i,'http://');
    var key=u.toLowerCase().split('/')[0]+'//'+u.split('/')[2];
    if(seen[key])return;seen[key]=1;
    out.push({t:a.textContent.trim()||u,u:u,d:''});
  });
  if(!out.length){
    var re=/https?:\/\/[a-z0-9-]+\.onion(?:\/[^\s"'<>)]*)?/gi,m;
    while((m=re.exec(text))){var k=m[0].toLowerCase();if(!seen[k]){seen[k]=1;out.push({t:m[0],u:m[0],d:''});}}
  }
  if(!out.length){
    /* repli markdown (r.jina.ai) : [titre](url .onion) */
    var md=/\[([^\]]+)\]\((https?:\/\/[^)\s]*\.onion[^)\s]*)\)/g,m2;
    while((m2=md.exec(text))){var k2=m2[2].toLowerCase();if(!seen[k2]){seen[k2]=1;out.push({t:m2[1].trim(),u:m2[2],d:''});}}
  }
  return out.slice(0,10);
}
function section(label,items,note){
  var h='<h2>'+esc(label)+'</h2>';
  if(note)h+='<p class="note">'+esc(note)+'</p>';
  if(!items.length)return h;
  h+='<ul>';
  items.forEach(function(r){h+='<li><a href="#" data-u="'+esc(r.u)+'">'+esc(r.t||r.u)+'</a>'
    +(r.d?'<span>'+esc(r.d.slice(0,120))+'</span>':'<span>'+esc(r.u)+'</span>')+'</li>';});
  return h+'</ul>';
}
function resultsPage(q,web,onion,errWeb,errOnion){
  var h='<!DOCTYPE html><html lang="'+LANG+'"><head><meta charset="utf-8"><style>'
  +'body{margin:0;padding:22px 4vw 40px;background:#07060a;color:#e9e1d0;font-family:"DM Mono",monospace}'
  +'h1{font-family:"Bebas Neue",sans-serif;font-weight:400;font-size:24px;letter-spacing:.1em;color:#ffe08a;margin:0 0 4px}'
  +'h2{font-size:12px;letter-spacing:.2em;color:#c9a84c;margin:26px 0 10px;border-bottom:1px solid rgba(201,168,76,.25);padding-bottom:6px}'
  +'ul{list-style:none;margin:0;padding:0}li{margin:0 0 14px}'
  +'a{color:#ffe08a;font-size:13px;text-decoration:none;display:block}a:hover{text-decoration:underline}'
  +'span{display:block;color:#8a8272;font-size:11px;margin-top:3px;line-height:1.6}'
  +'.note{color:#8a8272;font-size:11px;margin:0 0 10px}.top{color:#8a8272;font-size:11px;margin:0 0 8px}'
  +'</style></head><body>'
  +'<h1>'+esc(q)+'</h1><p class="top">'+esc(L('Entrée pour une nouvelle recherche dans la barre d\u2019adresse.','Type a new search in the address bar.'))+'</p>'
  +section(L('WEB — DUCKDUCKGO','WEB — DUCKDUCKGO'),web,errWeb)
  +section(L('.ONION — AHMIA','.ONION — AHMIA'),onion,errOnion)
  +'<script>document.addEventListener("click",function(e){var a=e.target.closest&&e.target.closest("a[data-u]");if(a){e.preventDefault();if(parent.__torGo)parent.__torGo(a.getAttribute("data-u"));}});<\/script>'
  +'</body></html>';
  sandbox(true);$('view').srcdoc=h;
}
window.__torGo=function(u){go(u,true);};
window.__torSearch=function(q){
  q=String(q||'').trim();if(!q)return;
  if(/^https?:\/\//i.test(q)||/\.onion/i.test(q)){go(q,true);return;}
  if(/^[\w.-]+\.[a-z]{2,}(\/|$)/i.test(q)){go('https://'+q,true);return;}
  $('url').value=q;document.body.classList.remove('home');
  status(L('L\u2019applicant doit être patient…','The applicant must be patient…'));
  hideNotice();$('tab').dataset.onion='';
  var done=0,web=[],onion=[],errWeb=null,errOnion=null;
  function fin(){done++;if(done<2)return;
    mark('search:'+q);refreshBtns();
    if(!web.length&&!onion.length){rejected(null);reloadFn=function(){__torSearch(q);};return;}
    resultsPage(q,web,onion,errWeb,errOnion);
    reloadFn=function(){__torSearch(q);};
    status('');}
  fetchVia(ddgUrl(q)).then(function(t){web=parseDdg(t);}).catch(function(){errWeb=' ';}).then(fin);
  fetchVia(ahmiaUrl(q)).then(function(t){onion=parseAhmia(t);}).catch(function(){errOnion=' ';}).then(fin);
};

/* ---- barre d'adresse ---- */
function go(input,push){
  var u=String(input||'').trim();
  if(!u){home();return;}
  if(/^https?:\/\//i.test(u)){nav(u,push);return;}
  if(/\.onion/i.test(u)){nav('http://'+u.replace(/^\/+/,''),push);return;}
  if(/^(index|fr)$/i.test(u))u=u.toLowerCase()+'.html';
  else if(/^fauna-[\w-]+$/i.test(u))u=u.toLowerCase()+'.html';
  else if(/^llms(\.txt)?$/i.test(u))u='llms.txt';
  else if(/^readme(\.md)?$/i.test(u))u='README.md';
  if(/^(index\.html|fr\.html|llms\.txt|README\.md|fauna-[\w-]+\.html|fotofauna\.html|tor\.html)$/i.test(u)){nav(u,push);return;}
  if(/^[\w.-]+\.[a-z]{2,}(\/|$)/i.test(u)){nav('https://'+u,push);return;}
  __torSearch(u);
}
$('go').addEventListener('click',function(){go($('url').value,true);});
$('url').addEventListener('keydown',function(e){if(e.key==='Enter')go($('url').value,true);});

/* ---- ↗ : une vraie fenêtre de navigation, hors encapsulation ---- */
function realWin(u){
  if(!/^https?:\/\//i.test(u)&&/^[\w.-]+\.[a-z]{2,}(\/|$)/i.test(u))u='https://'+u;
  var w=window.open(u,'torwin','menubar=yes,toolbar=yes,location=yes,status=yes,resizable=yes,scrollbars=yes,width=1020,height=760');
  if(w){try{w.focus();}catch(e){}}else{window.open(u,'_blank','noopener');}
  return !!w;}
$('tab').addEventListener('click',function(){
  var u=$('tab').dataset.onion||$('url').value.trim();
  if(!u)return;realWin(u);});

/* ---- boutons standards ---- */
$('back').addEventListener('click',function(){if(hi>0){hi--;var u=history_[hi];cur=u;refreshBtns();
  if(/^search:/.test(u))__torSearch(u.slice(7));
  else if(/^onion:/.test(u))nav(u.slice(6),false);
  else if(u==='home')home();
  else nav(u,false);}});
$('fwd').addEventListener('click',function(){if(hi<history_.length-1){hi++;var u=history_[hi];cur=u;refreshBtns();
  if(/^search:/.test(u))__torSearch(u.slice(7));
  else if(/^onion:/.test(u))nav(u.slice(6),false);
  else if(u==='home')home();
  else nav(u,false);}});
$('reload').addEventListener('click',function(){if(reloadFn)reloadFn();});
$('home').addEventListener('click',function(){push0=true;home();push0=false;});
$('lang').addEventListener('click',function(){setLang(LANG==='fr'?'en':'fr');reloadFn&&reloadFn();});
$('view').addEventListener('load',function(){if($('view').srcdoc)setTimeout(function(){try{$('view').contentDocument&&$('view').contentDocument.getElementById('q')&&$('view').contentDocument.getElementById('q').focus();}catch(e){}},0);});

setLang(LANG);home();
})();
</script>
