name: vhs-probe
on:
  workflow_dispatch:
  push:
    paths: ['.github/probe/**']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i playwright@1.47.2 && npx playwright install --with-deps chromium
      - run: node .github/probe/probe.mjs
