name: KorhoDesk · Lightning
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: korhodesk-registre
  cancel-in-progress: false
jobs:
  ln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Paiements Lightning reçus → clés
        env:
          KORHODESK_NWC: ${{ secrets.KORHODESK_NWC }}
          KORHOGOO_KEY: ${{ secrets.KORHOGOO_KEY }}
        run: |
          npm install --no-save --silent nostr-tools@2
          node tools/korhodesk-ln.mjs
      - name: Horodatage OpenTimestamps (blockchain Bitcoin)
        run: |
          git diff --quiet kave/korhodesk/registry.json && exit 0
          pip install --quiet opentimestamps-client
          R=$(cut -c1-16 kave/korhodesk/root.txt)
          mkdir -p kave/korhodesk/ots
          cp kave/korhodesk/root.txt "kave/korhodesk/ots/$R.txt"
          ots stamp "kave/korhodesk/ots/$R.txt"
      - name: Écriture
        run: |
          git diff --quiet kave/korhodesk/registry.json && exit 0
          git config user.name "Mauk Tenieb"
          git config user.email "MaukTenieb@users.noreply.github.com"
          git add kave/korhodesk
          git commit -m "KorhoDesk : clés Lightning"
          git pull --rebase
          git push
