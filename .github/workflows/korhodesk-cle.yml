name: KorhoDesk · clé
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Étiquette (8 signes)
        required: true
      eur:
        description: Montant en euros
        required: true
      date:
        description: Date du paiement (AAAA-MM-JJ)
        required: true
      rail:
        description: paypal ou ln
        default: paypal
      nom:
        description: Nom du soutien (Kalabass dès 5 €), facultatif
        default: ''
      reponse:
        description: Réponse à sa question (inscrite sur sa clé), facultatif ; euros = 0 pour répondre sans paiement
        default: ''
permissions:
  contents: write
concurrency:
  group: korhodesk-registre
  cancel-in-progress: false
jobs:
  cle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Émission ou renouvellement
        env:
          KORHOGOO_KEY: ${{ secrets.KORHOGOO_KEY }}
          TAG: ${{ inputs.tag }}
          EUR: ${{ inputs.eur }}
          DATE: ${{ inputs.date }}
          RAIL: ${{ inputs.rail }}
          NOM: ${{ inputs.nom }}
          REP: ${{ inputs.reponse }}
        run: node tools/korhodesk-issue.mjs "$TAG" "$EUR" "$DATE" "$RAIL" "$NOM" "$REP"
      - name: Horodatage OpenTimestamps (blockchain Bitcoin)
        run: |
          pip install --quiet opentimestamps-client
          R=$(cut -c1-16 kave/korhodesk/root.txt)
          mkdir -p kave/korhodesk/ots
          cp kave/korhodesk/root.txt "kave/korhodesk/ots/$R.txt"
          ots stamp "kave/korhodesk/ots/$R.txt"
      - name: Écriture
        env:
          TAG: ${{ inputs.tag }}
        run: |
          git config user.name "Mauk Tenieb"
          git config user.email "MaukTenieb@users.noreply.github.com"
          git add kave/korhodesk
          git commit -m "KorhoDesk : clé $TAG"
          git pull --rebase
          git push
